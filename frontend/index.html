      (it.low ? '<span class="ws-tag" style="background:#fff3e4;color:#b45309">不及格 ' + it.low + "</span>" : "") +
      "</div></div>";
  }

  function wsScoreItem(it) {
    // 雅思/托福是另一套量纲（9 / 120 分制），不能按百分制的 75 分线标红
    var lang = !!it.scale;
    var warn = !lang && it.score !== null && it.score < 75;
    return '<div class="ws-item"><div class="ws-split"><span class="grow">' +
      '<b style="font-size:13px">' + escapeHtml(it.course) + "</b>" +
      (lang ? '<span class="ws-tag" style="background:#eef2ff;color:#4338ca;margin-left:6px">' +
        escapeHtml(it.scale) + "</span>" : "") +
      '<div class="ws-meta" style="margin-top:3px">' + escapeHtml(it.semester) + "</div></span>" +
      '<span class="ws-score"><span class="num' + (warn ? " warn" : "") + '">' + it.score + "</span>" +
      '<span class="ws-meta">' + escapeHtml(it.level) + "</span></span></div></div>";
  }

  function wsTicketItem(it) {
    return '<div class="ws-item"><div class="ws-item-h"><b>' + escapeHtml(it.content) + "</b></div>" +
      '<div class="ws-item-h" style="margin-top:5px">' +
      '<span class="pill ' + pillClass(it.status) + '">' + escapeHtml(it.status) + "</span>" +
      '<span class="ws-meta">' + escapeHtml(it.student) + " · " + escapeHtml(it.time) + "</span></div></div>";
  }

  /* 左栏只放入口：每个身份能做什么，这里就是全部清单 */
  var NAV_ITEMS = {
    teacher: [
      { key: "students", icon: "🎒", title: "我的班级", sub: "本班学生 · 基本信息" },
      { key: "alerts", icon: "🫂", title: "心理预警", sub: "本班学生 · 高危优先" },
      { key: "journal", icon: "📔", title: "心理周记", sub: "本班学生 · 详细状态跟进" },
      { key: "feedback", icon: "📮", title: "反馈处理", sub: "学生提交 · 回复并结案" },
      { key: "leaves", icon: "🗓", title: "待处理请假", sub: "只批自己班上学生" },
      { key: "grades", icon: "📊", title: "成绩录入", sub: "只给班上学生录 / 改" },
    ],
    admin: [
      { key: "grades", icon: "📊", title: "成绩总览", sub: "全校成绩，只读" },
      { key: "accounts", icon: "👥", title: "账户管理", sub: "开账户 · 停用 / 启用 / 删除" },
    ],
    student: [
      { key: "myclass", icon: "🏫", title: "我的班级", sub: "班级 · 班主任" },
      { key: "leaves", icon: "🗓", title: "请假记录", sub: "查看批没批、审批意见" },
      { key: "grades", icon: "📊", title: "我的成绩", sub: "只看自己的课程" },
      { key: "journal", icon: "🧭", title: "心理关怀", sub: "写周记 · 看老师回复" },
      { key: "feedback", icon: "📮", title: "我的反馈", sub: "提交问题 · 看老师回复" },
    ],
    staff: [
      { key: "leads", icon: "📇", title: "客户线索", sub: "写跟进、改状态" },
      { key: "activities", icon: "🎪", title: "活动安排", sub: "设计活动 · 看谁报名了" },
      { key: "accounts", icon: "👥", title: "账户管理", sub: "只开自己名下的学员" },
    ],
  };

  function navItem(role, key) {
    return (NAV_ITEMS[role] || []).filter(function (x) { return x.key === key; })[0] || null;
  }

  function navList(d) {
    var cards = d.cards || [];
    function cardValue(label) {
      var hit = cards.filter(function (c) { return c.label === label; })[0];
      return hit && typeof hit.value === "number" ? hit.value : null;
    }
    // 活动项目老师带的是试听班：没有请假、成绩这些事，只有「试听学员」一件事
    var source = (d.role === "teacher" && d.class_kind === "试听班")
      ? [{ key: "trial", icon: "🎧", title: "试听学员", sub: "待签约 / 已签约 · 有联系方式的意向学员" }]
      : (NAV_ITEMS[d.role] || []);
    var items = source.map(function (it) {
      var n = 0;
      if (it.key === "leaves") {
        // 待批数优先取概览卡（管理员概览里的明细只取前 6 条，不能拿来当角标）
        var v = cardValue("待批请假");
        n = v !== null ? v : ((d.sections || []).filter(function (x) { return x.kind === "leave"; })[0] || { items: [] }).items
          .filter(function (r) { return r.status === "待审批"; }).length;
      } else if (it.key === "leads") {
        var ls = (d.sections || []).filter(function (x) { return x.kind === "lead"; })[0];
        n = ((ls ? ls.items : []) || []).filter(function (r) { return r.status !== "已流失"; }).length;
      } else if (it.key === "trial") {
        n = cardValue("待签约") || 0;
      } else if (it.key === "alerts") {
        // 每条预警单独算，同一学生连发三条就是三个数（老师不会被“合并”掉细节）
        n = (d.alerts || []).length;
      } else if (it.key === "feedback") {
        // 学生：自己还没被回复的；老师：本班还没结案的
        n = (d.feedback || []).filter(function (x) {
          return x.status !== "已解决";
        }).length;
      } else if (it.key === "journal") {
        n = (d.journals || []).filter(function (x) {
          return x.status !== "已跟进";
        }).length;
      }
      return { key: it.key, icon: it.icon, title: it.title, sub: it.sub, count: n };
    });
    items.push({
      key: "logs", icon: "▤", title: "我的日志",
      sub: "今日 " + (d.today_logs || 0) + " 条 · 只有自己能看", count: 0,
    });
    return items;
  }

  function renderNavs(d) {
    if (!d) return;
    el.navBlock.hidden = false;
    el.navs.innerHTML = navList(d).map(function (it) {
      return '<button class="nav' + (state.panelKey === it.key ? " on" : "") +
        '" data-key="' + it.key + '" type="button">' +
        '<span class="ic">' + it.icon + "</span>" +
        '<span class="nb"><b>' + it.title + "</b><span>" + it.sub + "</span></span>" +
        (it.count > 0 ? '<i class="nav-badge">' + (it.count > 99 ? "99+" : it.count) + "</i>" : "") +
        "</button>";
    }).join("");
  }

  function renderWsBadge(d) {
    var cards = d.cards || [];
    function num(label) {
      var hit = cards.filter(function (c) { return c.label === label; })[0];
      return hit && typeof hit.value === "number" ? hit.value : 0;
    }
    var n = 0;
    if (d.role === "teacher") n = num("待批请假") + num("学生反馈") + num("心理周记");
    else if (d.role === "staff") n = num("新增意向");
    else if (d.role === "student") n = num("待批请假") + num("我的反馈") + num("心理周记");
    if (n > 0) { el.wsBadge.hidden = false; el.wsBadge.textContent = n > 99 ? "99+" : n; }
    else el.wsBadge.hidden = true;
  }

  function loadWs() {
    return wsGet("/api/workspace")
      .then(function (d) {
        state.ws = d;
        renderWsBadge(d);
        renderNavs(d);
        if (state.panelKey && state.panelKey !== "logs" &&
            state.panelKey !== "accounts" && state.panelKey !== "activities") renderPanel();

        return d;
      })
      .catch(function (e) {
        if (state.panelKey === "logs") return;
        el.panelSub.textContent = "读取失败";
        if (state.panelKey) el.panelBody.innerHTML = '<div class="ws-empty">' + escapeHtml(e.message || String(e)) + "</div>";
      });
  }

  function logRowsHtml(rows) {
    return rows.map(function (r) {
      var cls = /失败|驳回/.test(r.result) ? "no" : "ok";
      return '<div class="ws-item"><div class="ws-item-h"><b>' + escapeHtml(r.action_label) + "</b>" +
        '<span class="pill ' + cls + '">' + escapeHtml(r.result) + "</span>" +
        '<span class="ws-meta">' + escapeHtml(r.time_short) + "</span></div>" +
        '<div class="ws-brief">' + escapeHtml(r.summary) + "</div>" +
        (r.detail ? '<div class="ws-meta ws-logdet">' + escapeHtml(r.detail) + "</div>" : "") +
        "</div>";
    }).join("");
  }

  function loadLogsInto(box, setSub) {
    box.innerHTML = '<div class="ws-empty">正在读取…</div>';
    wsGet("/api/my/logs?limit=80")
      .then(function (d) {
        var rows = d.rows || [];
        var t = d.today || {};
        var LAB = { leave_apply: "提交请假", leave_approve: "审批", leave_delete: "删请假", score_save: "录成绩", score_delete: "删成绩", lead_follow: "跟进", lead_status: "线索状态", lead_create: "留资", chat: "问小粤同学", leave_query: "查进度", feedback_submit: "提反馈", feedback_handle: "反馈处理", journal_submit: "写心理周记", journal_handle: "周记跟进", alert_handle: "预警处理" };
        var mix = Object.keys(t.by_action || {}).map(function (k) {
          return (LAB[k] || k) + " " + t.by_action[k];
        }).join(" · ");
        setSub("今天 " + (t.total || 0) + " 条" + (mix ? "（" + mix + "）" : "") + " · 只有你自己能看到");
        box.innerHTML = rows.length
          ? '<div class="ws-list">' + logRowsHtml(rows) + "</div>"
          : '<div class="ws-empty">还没有操作记录。审批、跟进、提交请假、咨询小粤同学都会记在这里。</div>';
      })
      .catch(function (e) {
        setSub("读取失败");
        box.innerHTML = '<div class="ws-empty">' + escapeHtml(e.message || String(e)) + "</div>";
      });
  }

  function renderPanel() {
    if (!state.panelKey) return;
    if (state.panelKey === "logs") {
      el.panelTitle.textContent = "我的日志";
      el.panelSub.textContent = "读取中…";
      loadLogsInto(el.panelBody, function (txt) { el.panelSub.textContent = txt; });
      return;
    }
    if (state.panelKey === "grades") { renderGradesPanel(); return; }
    if (state.panelKey === "accounts") { renderAccountsPanel(); return; }
    if (state.panelKey === "myclass") { renderMyClassPanel(); return; }
    if (state.panelKey === "alerts") { renderAlertsPanel(); return; }
    if (state.panelKey === "journal") { renderJournalPanel(); return; }
    if (state.panelKey === "feedback") { renderFeedbackPanel(); return; }
    if (state.panelKey === "trial") { renderTrialPanel(); return; }
    if (state.panelKey === "activities") { renderActivitiesPanel(); return; }
    var d = state.ws;
    if (!d) { el.panelBody.innerHTML = '<div class="ws-empty">正在读取…</div>'; return; }
    var kindMap = { leads: "lead", students: "student" };
    var kind = kindMap[state.panelKey] || "leave";
    var sec = (d.sections || []).filter(function (x) { return x.kind === kind; })[0];
    var base = navItem(d.role, state.panelKey);
    el.panelTitle.textContent = base ? base.title : "我的事项";
    if (!sec) { el.panelBody.innerHTML = '<div class="ws-empty">这里暂时没有内容</div>'; return; }
    el.panelSub.textContent = sec.hint || "";
    if (!sec.items.length) {
      el.panelBody.innerHTML = '<div class="ws-empty">暂时没有需要处理的事项</div>';
      return;
    }
    var html = '<div class="ws-list">';
    sec.items.forEach(function (it) {
      if (sec.kind === "lead") html += wsLeadItem(it, !!d.can_follow, d.lead_statuses || []);
      else if (sec.kind === "student") html += wsStudentItem(it);
      else html += wsLeaveItem(it, d.role === "teacher" || d.role === "admin");
    });
    el.panelBody.innerHTML = html + "</div>";
  }

  /* ---------------- 心理预警（班主任视角） ----------------
     每条预警单独一行：学生说了什么、什么时候说的、命中什么词。
     学生端没有任何入口，接口也不返回；老师处理完写一句记录，进日志备查。 */
  function wsAlertItem(a) {
    var high = a.risk === "高";
    var st = a.status || "未处理";
    return '<div class="ws-item al-card' + (high ? " high" : "") + '">' +
      '<div class="ws-item-h"><b>' + escapeHtml(a.student) + "</b>" +
      '<span class="pill ' + (high ? "no" : "wait") + '">' + escapeHtml(a.risk) + "危</span>" +
      '<span class="pill ' + (st === "已处理" ? "ok" : pillClass(st)) + '">' + escapeHtml(st) + "</span>" +
      '<span class="grow"></span><span class="ws-meta">' + escapeHtml(a.time) + "</span></div>" +
      '<div class="al-quote">“' + escapeHtml(a.quote) + "”</div>" +
      '<div class="ws-meta" style="margin-top:5px">' +
        escapeHtml(a.username ? "账号 " + a.username + " · " : "") + escapeHtml(a.basis || "") +
      "</div>" +
      '<div class="al-form"><textarea rows="2" placeholder="写一句沟通结果，例如：已电话联系，情绪平稳，家长知情">' +
        escapeHtml(a.note || "") + "</textarea>" +
        '<div class="ws-acts">' +
          '<button type="button" data-alert-act="跟进中" data-alert-id="' + a.id + '"' +
            (st === "跟进中" ? " disabled>已跟进中</button>" : ">开始跟进</button>") +
          '<button type="button" class="ok" data-alert-act="已处理" data-alert-id="' + a.id + '">标记已处理</button>' +
        "</div></div></div>";
  }

  function wsAlertDone(a) {
    return '<div class="al-done"><div class="ws-item-h"><b>' + escapeHtml(a.student) + "</b>" +
      '<span class="pill ' + (a.risk === "高" ? "no" : "wait") + '">' + escapeHtml(a.risk) + "危</span>" +
      '<span class="pill ok">已处理</span><span class="grow"></span>' +
      '<span class="ws-meta">' + escapeHtml(a.handle_time || a.time) +
      (a.handler ? " · " + escapeHtml(a.handler) : "") + "</span></div>" +
      (a.note ? '<div class="al-note">' + escapeHtml(a.note) + "</div>" : "") + "</div>";
  }

  function renderAlertsPanel() {
    el.panelTitle.textContent = "心理预警";
    if (!state.ws) {
      el.panelBody.innerHTML = '<div class="ws-empty">正在读取…</div>';
      loadWs();
      return;
    }
    var d = state.ws;
    var list = d.alerts || [];
    var hist = d.alert_history || [];
    el.panelSub.textContent = "本班学生 · 学生端看不到；高危优先，处理过程会记进日志";
    var html = list.length
      ? '<div class="ws-list">' + list.map(wsAlertItem).join("") + "</div>"
      : '<div class="ws-empty">本班现在没有待处理的心理预警。</div>';
    if (hist.length) {
      html += '<details class="al-hist" open><summary>已处理 · 最近 ' + hist.length + " 条</summary>" +
        hist.map(wsAlertDone).join("") + "</details>";
    }
    el.panelBody.innerHTML = html;
  }

  function handleAlert(id, status, btn) {
    var card = btn.closest(".al-card");
    var note = ((card && card.querySelector("textarea").value) || "").trim();
    if (status === "已处理" && !note) {
      toast("先写一句沟通结果再标记已处理，方便以后追溯", true);
      return;
    }
    var btns = card ? card.querySelectorAll("button") : [btn];
    Array.prototype.forEach.call(btns, function (b) { b.disabled = true; });
    fetch("/api/workspace/alert/" + id + "/handle", {
      method: "POST",
      headers: wsHeaders(),
      body: JSON.stringify({ status: status, note: note }),
    })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(detailText(d) || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg || "已保存");
        return loadWs();
      })
      .catch(function (e) {
        Array.prototype.forEach.call(btns, function (b) { b.disabled = false; });
        toast("保存失败：" + (e.message || e), true);
      });
  }

  /* ---------------- 心理周记（学生写 / 班主任跟进） ----------------
     比情绪评估多记睡眠、压力源、持续时长；提交后沉淀进心理画像，
     自评分值 >= 70 会同步生成一条心理预警给班主任。学生看得到回复。 */
  function jrScorePill(n) {
    n = Number(n) || 0;
    return '<span class="pill ' + (n >= 70 ? "no" : n >= 40 ? "wait" : "ok") + '">分值 ' + n + "</span>";
  }

  function jrMeta(f) {
    return "睡眠 " + escapeHtml(f.sleep || "—") + " · 压力 " +
      escapeHtml(f.stress_source || "—") + " · 持续 " + escapeHtml(f.duration || "—");
  }

  function jrMineItem(f) {
    return '<div class="ws-item jr-card">' +
      '<div class="ws-item-h"><span class="ws-tag">' + escapeHtml(f.mood_tag) + "</span>" +
      jrScorePill(f.mood_score) +
      '<span class="pill ' + (f.status === "已跟进" ? "ok" : pillClass(f.status)) + '">' +
        escapeHtml(f.status) + "</span>" +
      '<span class="grow"></span><span class="ws-meta">' + escapeHtml(f.time) + "</span></div>" +
      '<div class="ws-meta" style="margin-top:5px">' + jrMeta(f) + "</div>" +
      '<div class="fb-text">' + escapeHtml(f.content) + "</div>" +
      (f.reply
        ? '<div class="fb-reply"><b>班主任回复</b><span class="ws-meta">' +
          escapeHtml(f.handler || "") + (f.handle_time ? " · " + escapeHtml(f.handle_time) : "") + "</span>" +
          "<div>" + escapeHtml(f.reply) + "</div></div>"
        : '<div class="ws-meta fb-wait">' +
          (f.status === "跟进中" ? "班主任已接手，正在跟进" : "班主任还没回复，回复后会出现在这里") + "</div>") +
      "</div>";
  }

  function jrHandleItem(f) {
    var st = f.status || "待跟进";
    return '<div class="ws-item jr-card' + (st === "待跟进" ? " new" : "") + '">' +
      '<div class="ws-item-h"><b>' + escapeHtml(f.student) + "</b>" +
      (f.class_name ? '<span class="ws-tag">' + escapeHtml(f.class_name) + "</span>" : "") +
      '<span class="ws-tag">' + escapeHtml(f.mood_tag) + "</span>" +
      jrScorePill(f.mood_score) +
      '<span class="pill ' + (st === "已跟进" ? "ok" : pillClass(st)) + '">' + escapeHtml(st) + "</span>" +
      '<span class="grow"></span><span class="ws-meta">' + escapeHtml(f.time) + "</span></div>" +
      '<div class="ws-meta" style="margin-top:5px">' + jrMeta(f) + "</div>" +
      '<div class="fb-text">' + escapeHtml(f.content) + "</div>" +
      '<div class="al-form"><textarea rows="2" placeholder="写一句回复，学生会原样看到（例：已约明天上午聊，今晚先好好休息）">' +
        escapeHtml(f.reply || "") + "</textarea>" +
        '<div class="ws-acts">' +
          '<button type="button" data-jr-act="跟进中" data-jr-id="' + f.id + '"' +
            (st === "跟进中" ? " disabled>跟进中</button>" : ">开始跟进</button>") +
          '<button type="button" class="ok" data-jr-act="已跟进" data-jr-id="' + f.id + '">回复并完成</button>' +
        "</div></div></div>";
  }

  function jrDoneItem(f) {
    return '<div class="al-done"><div class="ws-item-h"><b>' + escapeHtml(f.student) + "</b>" +
      '<span class="ws-tag">' + escapeHtml(f.mood_tag) + "</span>" +
      jrScorePill(f.mood_score) + '<span class="pill ok">已跟进</span>' +
      '<span class="grow"></span><span class="ws-meta">' + escapeHtml(f.handle_time || f.time) +
      (f.handler ? " · " + escapeHtml(f.handler) : "") + "</span></div>" +
      (f.reply ? '<div class="al-note">' + escapeHtml(f.reply) + "</div>" : "") + "</div>";
  }

  function jrChips(group, values, def) {
    return values.map(function (v) {
      return '<button type="button" class="jr-chip' + (v === def ? " on" : "") +
        '" data-jr-group="' + group + '" data-jr-value="' + escapeHtml(v) + '">' + escapeHtml(v) + "</button>";
    }).join("");
  }

  function jrProfileHtml(p) {
    if (!p) {
      return '<div class="ws-item jr-profile"><b>我的心理画像</b>' +
        '<div class="ws-meta" style="margin-top:5px">还没有记录，提交第一篇周记后会自动生成。</div></div>';
    }
    var hist = p.history || [];
    return '<div class="ws-item jr-profile">' +
      '<div class="ws-item-h"><b>我的心理画像</b>' +
      '<span class="ws-tag">最新 ' + escapeHtml(p.tag) + "</span>" +
      jrScorePill(p.score) + '<span class="grow"></span>' +
      '<span class="ws-meta">最近交互 ' + escapeHtml(p.last || "—") + "</span></div>" +
      '<div class="cls-head" style="margin-top:8px"><b>历史情绪</b><span>最近 ' +
        hist.length + " 条 · 共 " + (p.total || hist.length) + " 条</span></div>" +
      (hist.length
        ? '<div class="jr-hist">' + hist.map(function (h) {
            return '<span class="jr-hit"><b>' + escapeHtml(h.tag || "—") + "</b> · " +
              escapeHtml(String(h.score === null || h.score === undefined ? "—" : h.score)) +
              " 分 · " + escapeHtml((h.time || "").slice(5, 16)) + "</span>";
          }).join("") + "</div>"
        : '<div class="ws-meta" style="margin-top:5px">暂无历史记录</div>') +
      "</div>";
  }

  function jrFormHtml(d) {
    var o = d.journal_options || {};
    return '<form class="jr-form">' +
      '<div class="jr-line"><b>现在的心情</b><div class="jr-cats">' +
        jrChips("tag", o.tags || ["平静", "低落", "焦虑", "烦躁", "疲惫", "其他"], "平静") + "</div></div>" +
      '<div class="jr-line"><b>难受程度</b><div class="jr-range">' +
        '<input type="range" name="mood_score" min="0" max="100" value="50">' +
        '<output>50</output><span class="ws-meta">0 很轻松 · 100 很难受</span></div></div>' +
      '<div class="jr-line"><b>最近睡眠</b><div class="jr-cats">' +
        jrChips("sleep", o.sleeps || ["良好", "一般", "较差"], "一般") + "</div></div>" +
      '<div class="jr-line"><b>主要压力</b><div class="jr-cats">' +
        jrChips("source", o.sources || ["学业", "人际", "家庭", "就业", "经济", "其他"], "学业") + "</div></div>" +
      '<div class="jr-line"><b>持续多久</b><div class="jr-cats">' +
        jrChips("duration", o.durations || ["今天", "几天", "一两周", "一个月以上"], "今天") + "</div></div>" +
      '<textarea name="content" rows="3" maxlength="500" ' +
        'placeholder="想说的话：发生了什么、身体和睡眠怎么样、希望老师帮什么。例：连续一周睡不着，上课听不进去，怕跟不上进度"></textarea>' +
      '<div class="fb-foot"><span class="ws-meta">分值 ≥ 70 会同步提醒班主任；回复只有你和班主任看得到</span>' +
        '<button type="submit">提交周记</button></div>' +
      "</form>";
  }

  function renderJournalPanel() {
    var isStudent = state.user && state.user.role === "student";
    el.panelTitle.textContent = isStudent ? "心理关怀" : "心理周记";
    if (!state.ws) {
      el.panelBody.innerHTML = '<div class="ws-empty">正在读取…</div>';
      loadWs();
      return;
    }
    var d = state.ws;
    var list = d.journals || [];
    el.panelSub.textContent = isStudent
      ? "写得越具体，班主任越好帮你 · 数据会沉淀进心理画像"
      : "本班学生写的状态 · 回复后学生能看到；已跟进的收在下面";
    var html = "";
    if (isStudent) {
      html += jrProfileHtml(d.profile);
      html += jrFormHtml(d);
      html += list.length
        ? '<div class="cls-head"><b>我写过的</b><span>' + list.length + " 篇 · 最新在前</span></div>" +
          '<div class="ws-list">' + list.map(jrMineItem).join("") + "</div>"
        : '<div class="ws-empty" style="padding:14px 0">还没写过周记，上面填一篇就行。</div>';
      el.panelBody.innerHTML = html;
      return;
    }
    html += list.length
      ? '<div class="ws-list">' + list.map(jrHandleItem).join("") + "</div>"
      : '<div class="ws-empty">本班现在没有待跟进的心理周记。</div>';
    var hist = d.journal_history || [];
    if (hist.length) {
      html += '<details class="al-hist" open><summary>已跟进 · 最近 ' + hist.length + " 篇</summary>" +
        hist.map(jrDoneItem).join("") + "</details>";
    }
    el.panelBody.innerHTML = html;
  }

  function jrPick(form, group, def) {
    var on = form.querySelector('.jr-chip.on[data-jr-group="' + group + '"]');
    return on ? on.getAttribute("data-jr-value") : def;
  }

  function submitJournal(form) {
    var text = (form.querySelector('[name="content"]').value || "").trim();
    if (text.length < 4) { toast("多写几句，班主任才好跟进（至少 4 个字）", true); return; }
    var score = form.querySelector('[name="mood_score"]').value;
    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    fetch("/api/workspace/journal", {
      method: "POST",
      headers: wsHeaders(),
      body: JSON.stringify({
        content: text,
        mood_tag: jrPick(form, "tag", "其他"),
        mood_score: Number(score),
        sleep: jrPick(form, "sleep", "一般"),
        stress_source: jrPick(form, "source", "其他"),
        duration: jrPick(form, "duration", "今天"),
      }),
    })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(detailText(d) || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg || "已提交");
        return loadWs();
      })
      .catch(function (e) {
        btn.disabled = false;
        toast("保存失败：" + (e.message || e), true);
      });
  }

  function handleJournal(id, status, btn) {
    var card = btn.closest(".jr-card");
    var reply = ((card && card.querySelector("textarea").value) || "").trim();
    if (status === "已跟进" && !reply) {
      toast("先写一句回复再完成跟进，学生会看到这句话", true);
      return;
    }
    var btns = card ? card.querySelectorAll("button") : [btn];
    Array.prototype.forEach.call(btns, function (b) { b.disabled = true; });
    fetch("/api/workspace/journal/" + id + "/handle", {
      method: "POST",
      headers: wsHeaders(),
      body: JSON.stringify({ status: status, reply: reply }),
    })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(detailText(d) || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg || "已保存");
        return loadWs();
      })
      .catch(function (e) {
        Array.prototype.forEach.call(btns, function (b) { b.disabled = false; });
        toast("保存失败：" + (e.message || e), true);
      });
  }

  /* ---------------- 学生反馈（学生提交 / 班主任回复） ----------------
     学生只在「我的反馈」里看到自己提的，和老师给的那一句回复；
     老师看到的是本班全部未结反馈，回完一句才能结案（和学生端看到的一致）。 */
  var FB_CATS = ["课程教学", "老师沟通", "住宿生活", "报修设施", "教务流程", "其他"];

  function fbStatusPill(st) {
    if (st === "已解决") return "ok";
    if (st === "处理中") return "wait";
    return "wait";
  }

  /* 学生视角：一条反馈 + 老师回复 */
  function fbMineItem(f) {
    return '<div class="ws-item fb-card">' +
      '<div class="ws-item-h"><span class="ws-tag">' + escapeHtml(f.category) + "</span>" +
      '<span class="pill ' + fbStatusPill(f.status) + '">' + escapeHtml(f.status) + "</span>" +
      '<span class="grow"></span><span class="ws-meta">' + escapeHtml(f.time) + "</span></div>" +
      '<div class="fb-text">' + escapeHtml(f.content) + "</div>" +
      (f.detail && f.detail !== f.content
        ? '<div class="ws-meta fb-detail">' + escapeHtml(f.detail) + "</div>" : "") +
      (f.reply
        ? '<div class="fb-reply"><b>班主任回复</b><span class="ws-meta">' +
          escapeHtml(f.handler || "") + (f.handle_time ? " · " + escapeHtml(f.handle_time) : "") + "</span>" +
          "<div>" + escapeHtml(f.reply) + "</div></div>"
        : '<div class="ws-meta fb-wait">' +
          (f.status === "处理中" ? "班主任已接手，正在处理" : "班主任还没回复，回复后会出现在这里") + "</div>") +
      "</div>";
  }

  /* 老师视角：一条未结反馈 + 回复框 + 处理按钮 */
  function fbHandleItem(f) {
    var st = f.status || "待处理";
    return '<div class="ws-item fb-card' + (st === "待处理" ? " new" : "") + '">' +
      '<div class="ws-item-h"><b>' + escapeHtml(f.student) + "</b>" +
      (f.class_name ? '<span class="ws-tag">' + escapeHtml(f.class_name) + "</span>" : "") +
      '<span class="ws-tag">' + escapeHtml(f.category) + "</span>" +
      '<span class="pill ' + fbStatusPill(st) + '">' + escapeHtml(st) + "</span>" +
      '<span class="grow"></span><span class="ws-meta">' + escapeHtml(f.time) + "</span></div>" +
      '<div class="fb-text">' + escapeHtml(f.content) + "</div>" +
      (f.detail && f.detail !== f.content
        ? '<div class="ws-meta fb-detail">' + escapeHtml(f.detail) + "</div>" : "") +
      '<div class="al-form"><textarea rows="2" placeholder="写一句回复，学生会原样看到（例：已联系宿管，明天上午上门维修）">' +
        escapeHtml(f.reply || "") + "</textarea>" +
        '<div class="ws-acts">' +
          '<button type="button" data-fb-act="处理中" data-fb-id="' + f.id + '"' +
            (st === "处理中" ? " disabled>处理中</button>" : ">开始处理</button>") +
          '<button type="button" class="ok" data-fb-act="已解决" data-fb-id="' + f.id + '">回复并结案</button>' +
        "</div></div></div>";
  }

  function fbDoneItem(f) {
    return '<div class="al-done"><div class="ws-item-h"><b>' + escapeHtml(f.student) + "</b>" +
      '<span class="ws-tag">' + escapeHtml(f.category) + "</span>" +
      '<span class="pill ok">已解决</span><span class="grow"></span>' +
      '<span class="ws-meta">' + escapeHtml(f.handle_time || f.time) +
      (f.handler ? " · " + escapeHtml(f.handler) : "") + "</span></div>" +
      (f.reply ? '<div class="al-note">' + escapeHtml(f.reply) + "</div>" : "") + "</div>";
  }

  function fbFormHtml(d) {
    var cats = d.feedback_categories || FB_CATS;
    return '<form class="fb-form">' +
      '<div class="fb-cats">' +
        cats.map(function (c, i) {
          return '<button type="button" class="fb-cat' + (i === 0 ? " on" : "") +
            '" data-fb-cat="' + escapeHtml(c) + '">' + escapeHtml(c) + "</button>";
        }).join("") +
      "</div>" +
      '<textarea name="content" rows="3" maxlength="500" ' +
        'placeholder="说清楚时间、地点或课程、具体问题，老师才好处理。例：A302 空调 11 月 14 日起不制冷，报修两次没人来"></textarea>' +
      '<div class="fb-foot"><span class="ws-meta">提交后由班主任处理，回复会显示在下面</span>' +
        '<button type="submit">提交反馈</button></div>' +
      "</form>";
  }

  function renderFeedbackPanel() {
    var role = state.user && state.user.role;
    var isStudent = role === "student";
    el.panelTitle.textContent = isStudent ? "我的反馈" : "反馈处理";
    if (!state.ws) {
      el.panelBody.innerHTML = '<div class="ws-empty">正在读取…</div>';
      loadWs();
      return;
    }
    var d = state.ws;
    var list = d.feedback || [];
    el.panelSub.textContent = isStudent
      ? "课程 / 住宿 / 报修都能提 · 班主任回复后在这里看"
      : "本班学生提交 · 回复后学生能看到；已结案的收在下面";

    var html = "";
    if (isStudent) {
      html += fbFormHtml(d);
      html += list.length
        ? '<div class="cls-head"><b>我提过的</b><span>' + list.length + " 条 · 最新在前</span></div>" +
          '<div class="ws-list">' + list.map(fbMineItem).join("") + "</div>"
        : '<div class="ws-empty" style="padding:14px 0">还没提交过反馈，上面写一条就行。</div>';
      el.panelBody.innerHTML = html;
      return;
    }

    html += list.length
      ? '<div class="ws-list">' + list.map(fbHandleItem).join("") + "</div>"
      : '<div class="ws-empty">本班现在没有待处理的反馈。</div>';
    var hist = d.feedback_history || [];
    if (hist.length) {
      html += '<details class="al-hist" open><summary>已结案 · 最近 ' + hist.length + " 条</summary>" +
        hist.map(fbDoneItem).join("") + "</details>";
    }
    el.panelBody.innerHTML = html;
  }

  function submitFeedback(form) {
    var text = (form.querySelector('[name="content"]').value || "").trim();
    var on = form.querySelector(".fb-cat.on");
    var category = on ? on.getAttribute("data-fb-cat") : "其他";
    if (text.length < 4) { toast("把问题写清楚一点（至少 4 个字）", true); return; }
    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    fetch("/api/workspace/feedback", {
      method: "POST",
      headers: wsHeaders(),
      body: JSON.stringify({ content: text, category: category }),
    })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(detailText(d) || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg || "已提交");
        return loadWs();
      })
      .catch(function (e) {
        btn.disabled = false;
        toast("提交失败：" + (e.message || e), true);
      });
  }

  /* ---------------- 成绩：老师只看到自己学生，学生只看到自己 ---------------- */
  function gradeRow(s, canEdit) {
    var scores = s.scores || [];
    var avgText = s.count ? "均分 " + (s.avg === null ? "—" : s.avg) : "暂无成绩";
    var h = '<div class="ws-item"><div class="ws-item-h"><b>' + escapeHtml(s.name) + "</b>" +
      '<span class="pill ' + (s.count ? pillClass(s.level) : "wait") + '">' + avgText + "</span>" +
      (s.failed ? '<span class="ws-tag" style="background:#fff3e4;color:#b45309">不及格 ' + s.failed + "</span>" : "") +
      '<span class="ws-meta">' + escapeHtml(s.class_name ? s.class_name + " · " : "") + escapeHtml(s.dept) +
      (s.teacher && s.teacher !== "—" ? " · 班主任 " + escapeHtml(s.teacher) : "") + "</span></div>";

    if (scores.length) {
      h += '<div class="g-rows">' + scores.map(function (x) {
        var lang = /雅思|托福|IELTS|TOEFL/.test(x.course || "");
        var scale = /雅思|IELTS/.test(x.course || "") ? "9 分制"
          : (/托福|TOEFL/.test(x.course || "") ? "120 分制" : "");
        return '<div class="g-row" data-score-id="' + x.id + '">' +
          '<span class="g-course">' + escapeHtml(x.course) +
            (scale ? '<span class="ws-tag" style="background:#eef2ff;color:#4338ca;margin-left:5px">' +
              scale + "</span>" : "") + "</span>" +
          '<span class="g-sem">' + escapeHtml(x.semester) + "</span>" +
          '<span class="g-score' + (!lang && x.level === "待提升" ? " warn" : "") + '">' + x.score + "</span>" +
          (canEdit ? '<button type="button" class="g-edit" data-score="' + x.id +
            '" data-value="' + x.score + '" title="修改这条成绩">改</button>' : "") +
          (canEdit ? '<button type="button" class="g-del" data-score="' + x.id + '" title="删除这条成绩">✕</button>' : "") +
          "</div>";
      }).join("") + "</div>";
    } else {
      h += '<div class="ws-brief">还没有成绩记录' + (canEdit ? "，用下面的表单录一条" : "") + "。</div>";
    }

    if (canEdit) {
      h += '<form class="g-form" data-student="' + s.id + '">' +
        '<input name="course" placeholder="课程名，如 学术英语" maxlength="30">' +
        '<input name="score" placeholder="分数" inputmode="decimal" maxlength="6">' +
        '<input name="semester" placeholder="学期（可空）" maxlength="30">' +
        "<button type=\"submit\">录入</button></form>" +
        '<div class="ws-meta" style="margin-top:6px">雅思按 9 分制（如 6.5）、托福按 120 分制录入；' +
        "语言成绩单独评级，不计入百分制均分。</div>";
    }
    return h + "</div>";
  }

  function renderGradesPanel() {
    var base = navItem(state.user && state.user.role, "grades") || {};
    el.panelTitle.textContent = base.title || "成绩";
    el.panelSub.textContent = "读取中…";
    el.panelBody.innerHTML = '<div class="ws-empty">正在读取…</div>';
    wsGet("/api/grades")
      .then(function (d) {
        var rows = d.rows || [];
        var sum = d.summary || {};
        el.panelSub.textContent = (d.note || "") +
          (sum.avg !== null && sum.avg !== undefined ? " · 均分 " + sum.avg : "") +
          (sum.missing ? " · " + sum.missing + " 人还没录成绩" : "");
        if (!rows.length) {
          el.panelBody.innerHTML = '<div class="ws-empty">这里暂时没有学生</div>';
          return;
        }
        el.panelBody.innerHTML = '<div class="ws-list">' +
          rows.map(function (s) { return gradeRow(s, !!d.can_edit); }).join("") + "</div>";
      })
      .catch(function (e) {
        el.panelSub.textContent = "读取失败";
        el.panelBody.innerHTML = '<div class="ws-empty">' + escapeHtml(e.message || String(e)) + "</div>";
      });
  }

  function saveGrade(form) {
    var sid = Number(form.getAttribute("data-student"));
    var course = (form.querySelector('[name="course"]').value || "").trim();
    var raw = (form.querySelector('[name="score"]').value || "").trim();
    var sem = (form.querySelector('[name="semester"]').value || "").trim();
    if (!course) { toast("先填课程名", true); return; }
    if (raw === "" || isNaN(Number(raw))) { toast("分数要填数字", true); return; }

    var btn = form.querySelector("button");
    btn.disabled = true;
    fetch("/api/grades", {
      method: "POST",
      headers: wsHeaders(),
      body: JSON.stringify({ student_id: sid, course_name: course, score: Number(raw), semester: sem || null }),
    })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg || "已保存");
        renderGradesPanel();
        loadWs();
      })
      .catch(function (e) {
        btn.disabled = false;
        toast("保存失败：" + (e.message || e), true);
      });
  }

  function deleteGrade(scoreId, btn) {
    if (!window.confirm("删除这条成绩？操作会记进日志，但成绩本身不能恢复。")) return;
    btn.disabled = true;
    fetch("/api/grades/" + scoreId, { method: "DELETE", headers: wsHeaders() })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg || "已删除");
        renderGradesPanel();
        loadWs();
      })
      .catch(function (e) {
        btn.disabled = false;
        toast("删除失败：" + (e.message || e), true);
      });
  }

  function startScoreEdit(btn) {
    var row = btn.closest(".g-row");
    if (!row) return;
    var id = btn.getAttribute("data-score");
    var val = btn.getAttribute("data-value");
    var course = row.querySelector(".g-course").textContent;
    row.classList.add("editing");
    row.innerHTML =
      '<span class="g-course">' + escapeHtml(course) + "</span>" +
      '<input class="g-input" type="text" inputmode="decimal" value="' + escapeHtml(val) + '">' +
      '<button type="button" class="g-save" data-score="' + id + '">存</button>' +
      '<button type="button" class="g-cancel">取消</button>';
    var input = row.querySelector(".g-input");
    input.focus();
    input.select();
  }

  function saveScoreEdit(btn) {
    if (btn.disabled) return;
    var row = btn.closest(".g-row");
    var input = row && row.querySelector(".g-input");
    if (!input) return;
    var raw = (input.value || "").trim();
    if (raw === "" || isNaN(Number(raw))) { toast("分数要填数字", true); return; }
    var v = Number(raw);
    if (v < 0 || v > 150) { toast("分数需在 0~150 之间", true); return; }

    btn.disabled = true;
    fetch("/api/grades/" + btn.getAttribute("data-score"), {
      method: "PUT",
      headers: wsHeaders(),
      body: JSON.stringify({ score: v }),
    })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg || "已修改");
        renderGradesPanel();
      })
      .catch(function (e) {
        btn.disabled = false;
        toast("修改失败：" + (e.message || e), true);
      });
  }

      '<div class="acct-hint">选主题会顺手填好类型、地点、名额和简介，哪一格不合适就改成别的；' +
      "发布后登录页的小粤同学会按时间顺序推荐这场活动，名额报满自动改推其它场次，" +
      "报名人同时进你的客户线索。</div>";
  }

  function actPickValue(form, name) {
    var sel = form.querySelector('select[name="' + name + '"]');
    var cus = form.querySelector('input[name="' + name + '_custom"]');
    if (sel && sel.value === "__custom" && cus) return (cus.value || "").trim();
    if (sel) return (sel.value || "").trim();
    var plain = form.querySelector('[name="' + name + '"]');
    return plain ? (plain.value || "").trim() : "";
  }

  function actPickSet(form, name, value) {
    var sel = form.querySelector('select[name="' + name + '"]');
    var cus = form.querySelector('input[name="' + name + '_custom"]');
    if (!sel || !value) return;
    var hit = Array.prototype.some.call(sel.options, function (o) { return o.value === value; });
    if (hit) {
      sel.hidden = false;
      sel.value = value;
      if (cus) { cus.hidden = true; cus.value = ""; }
    } else if (cus) {
      sel.hidden = true;
      sel.value = "__custom";
      cus.hidden = false;
      cus.value = value;
    }
  }

  function onActPick(sel) {
    var form = sel.closest("form");
    if (!form) return;
    var name = sel.getAttribute("name");
    var cus = form.querySelector('input[name="' + name + '_custom"]');
    if (name === "speaker") {
      // 人工选过主讲就把「自动填」的标记清掉，后面换主题不再覆盖他的选择
      sel.removeAttribute("data-auto");
      return;
    }
    if (sel.value === "__custom") {
      if (cus) { sel.hidden = true; cus.hidden = false; cus.focus(); }
      return;
    }
    if (cus) { cus.hidden = true; cus.value = ""; }
    if (name !== "title") return;
    var t = ACT_TOPICS.filter(function (x) { return x.title === sel.value; })[0];
    if (!t) return;
    var cat = form.querySelector('[name="category"]');
    if (cat) cat.value = t.category;
    var cap = form.querySelector('[name="capacity"]');
    if (cap) cap.value = t.capacity;
    actPickSet(form, "location", t.place);
    actPickSet(form, "description", t.desc);
    // 主讲老师：主题里写了谁就选谁（试听课 / 说明会 → 张老师，方向分享 → 该方向班主任）。
    // 换主题时只在「还是自动填的那一个」时才跟着换，手动改过的保持不动。
    var sp = form.querySelector('select[name="speaker"]');
    if (sp) {
      var auto = sp.getAttribute("data-auto") || "";
      if (!sp.value || sp.value === auto) {
        var want = t.speaker || "";
        var picked = want && Array.prototype.filter.call(sp.options, function (o) {
          return o.value === want;
        })[0];
        if (picked) {
          sp.value = want;
          sp.setAttribute("data-auto", want);
        } else if (t.dept) {
          var byDept = Array.prototype.filter.call(sp.options, function (o) {
            return o.value && o.value !== "__custom" && o.textContent.indexOf(t.dept) >= 0;
          })[0];
          if (byDept) {
            sp.value = byDept.value;
            sp.setAttribute("data-auto", byDept.value);
          }
        }
      }
    }
  }

  function actPeopleHtml(rows) {
    if (!rows || !rows.length) return '<div class="act-empty">还没有人报名</div>';
    return '<div class="act-people">' + rows.map(function (s) {
      return '<div class="act-person"><b>' + escapeHtml(s.name) + "</b>" +
        (s.lead_status ? '<span class="pill ' + pillClass(s.lead_status) + '">' +
          escapeHtml(s.lead_status) + "</span>" : "") +
        '<span class="act-phone">' + escapeHtml(s.phone) + "</span>" +
        (s.remark ? '<span class="act-note">' + escapeHtml(s.remark) + "</span>" : "") +
        '<span class="act-time">' + escapeHtml(s.time) + "</span></div>";
    }).join("") + "</div>";
  }

  function actItemHtml(a) {
    var pct = a.capacity ? Math.min(100, Math.round(a.signed / a.capacity * 100)) : 0;
    var closed = a.status !== "开放报名";
    var stateText = closed ? "已结束" : (a.full ? "已满" : "报名中");
    var stateCls = closed ? "no" : (a.full ? "wait" : "ok");
    var open = !!actOpen[a.id];
    return '<div class="ws-item act-item" data-act-id="' + a.id + '">' +
      '<div class="ws-item-h"><b>' + escapeHtml(a.title) + "</b>" +
      '<span class="pill ' + stateCls + '">' + stateText + "</span>" +
      '<span class="ws-tag">' + escapeHtml(a.category) + "</span>" +
      '<span class="ws-meta">' + escapeHtml(a.start) + " · " + escapeHtml(a.speaker) +
      " · " + escapeHtml(a.location) +
      (a.created_by_name && a.created_by_name !== "—" ? " · 创建 " + escapeHtml(a.created_by_name) : "") +
      "</span></div>" +
      (a.description ? '<div class="ws-brief">' + escapeHtml(a.description) + "</div>" : "") +
      '<div class="act-bar"><i class="' + (a.full ? "full" : "") + '" style="width:' + pct + '%"></i></div>' +
      '<div class="act-line"><span>已报名 <b>' + a.signed + "</b> / " + a.capacity +
      " 人 · 余 " + a.remaining + " 个名额</span>" +
      '<button type="button" class="act-toggle" data-act="toggle">' +
      (open ? "收起参与人员" : "参与人员 " + a.signed) + "</button></div>" +
      (open ? actPeopleHtml(a.signups) : "") +
      '<div class="acct-acts">' +
      (closed ? '<button type="button" data-act="reopen">恢复报名</button>'
              : '<button type="button" data-act="close">结束报名</button>') +
      '<button type="button" class="danger" data-act="del">删除</button>' +
      "</div></div>";
  }

  function renderActivitiesPanel() {
    var base = navItem(state.user && state.user.role, "activities") || {};
    var keepTop = el.panelBody.scrollTop;
    el.panelTitle.textContent = base.title || "活动安排";
    el.panelSub.textContent = "读取中…";
    el.panelBody.innerHTML = '<div class="ws-empty">正在读取…</div>';
    wsGet("/api/activities")
      .then(function (d) {
        var rows = d.rows || [];
        var people = rows.reduce(function (n, a) { return n + (a.signed || 0); }, 0);
        el.panelSub.textContent = "共 " + rows.length + " 场活动 · " + people +
          " 人报名 · 只显示自己设计的活动";
        el.panelBody.innerHTML = actFormHtml(d.speakers) +
          (rows.length
            ? '<div class="ws-list">' + rows.map(actItemHtml).join("") + "</div>"
            : '<div class="ws-empty">还没有活动，用上面的表单发一场。</div>');
        el.panelBody.scrollTop = keepTop;
      })
      .catch(function (e) {
        el.panelSub.textContent = "读取失败";
        el.panelBody.innerHTML = '<div class="ws-empty">' + escapeHtml(e.message || String(e)) + "</div>";
      });
  }

  function createActivity(form) {
    if (form.getAttribute("data-busy") === "1") return;
    function val(n) { return actPickValue(form, n); }
    var body = {
      title: val("title"),
      category: val("category"),
      speaker: val("speaker"),
      start_time: val("start_time"),
      location: val("location"),
      capacity: Number(val("capacity") || 0),
      description: val("description"),
    };
    if (!body.title) { toast("请填活动名称", true); return; }
    if (!body.start_time) { toast("请选择活动时间", true); return; }
    if (!body.capacity || body.capacity < 1) { toast("名额至少 1 人", true); return; }

    form.setAttribute("data-busy", "1");
    var btn = form.querySelector("button");
    btn.disabled = true;
    fetch("/api/activities", {
      method: "POST",
      headers: wsHeaders(),
      body: JSON.stringify(body),
    })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(detailText(d) || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg || "活动已发布");
        actOpen = {};
        renderActivitiesPanel();
      })
      .catch(function (e) {
        form.setAttribute("data-busy", "0");
        btn.disabled = false;
        toast("发布失败：" + (e.message || e), true);
      });
  }

  function handleActAction(btn) {
    var item = btn.closest(".act-item");
    if (!item) return;
    var id = item.getAttribute("data-act-id");
    var act = btn.getAttribute("data-act");

    if (act === "toggle") {
      actOpen[id] = !actOpen[id];
      renderActivitiesPanel();
      return;
    }
    if (btn.disabled) return;

    if (act === "del") {
      if (!window.confirm("删除这场活动？已经有人报名的活动不能删，可以改成结束报名。")) return;
      btn.disabled = true;
      fetch("/api/activities/" + id, { method: "DELETE", headers: wsHeaders() })
        .then(function (r) {
          return r.json().then(function (d) {
            if (!r.ok) throw new Error(detailText(d) || ("HTTP " + r.status));
            return d;
          });
        })
        .then(function (d) {
          toast(d.msg || "活动已删除");
          delete actOpen[id];
          renderActivitiesPanel();
        })
        .catch(function (e) {
          btn.disabled = false;
          toast(e.message || "删除失败", true);
        });
      return;
    }

    btn.disabled = true;
    fetch("/api/activities/" + id + "/status", {
      method: "POST",
      headers: wsHeaders(),
      body: JSON.stringify({ action: act === "close" ? "close" : "open" }),
    })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(detailText(d) || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg || "已更新");
        renderActivitiesPanel();
      })
      .catch(function (e) {
        btn.disabled = false;
        toast(e.message || "操作失败", true);
      });
  }

  /* ---------------- 账户管理 ---------------- */
  function acctFormHtml(d) {
    var can = d.can_create || [];
    if (can.indexOf("student") >= 0) {
      // 试听班不收正式学员，开户下拉里只给常规班
      var classes = (d.classes || []).filter(function (c) {
        return (c.kind || "常规班") !== "试听班";
      });
      var opts = classes.map(function (c) {
        return '<option value="' + c.id + '" data-teacher="' + escapeHtml(c.teacher) + '">' +
          escapeHtml(c.name) + " · " + escapeHtml(c.teacher) +
          "（" + c.students + " 人）</option>";
      }).join("");
      var first = classes[0];
      var hint = first
        ? "班级决定班主任：" + first.name + " 归 " + first.teacher +
          " 负责，这位学员的请假和成绩自动归他；一个班只对应一位老师，不能交叉。"
        : "还没有班级。先在下面「班级与班主任」里开班，再回来开学员。";
      return '<form class="acct-form" data-kind="student">' +
        '<input name="real_name" placeholder="学员姓名（可以重名）" maxlength="20">' +
        '<input name="username" placeholder="登录账号（不能重名）" maxlength="20">' +
        '<span class="pick f-class"><select name="class_id" title="选择班级">' +
        (opts || '<option value="">暂无班级</option>') + "</select></span>" +
        '<input name="contact" placeholder="手机号（可空）" maxlength="20">' +
        '<button type="submit">开账户</button></form>' +
        '<div class="acct-hint class-hint">' + escapeHtml(hint) + "</div>";
    }
    return '<form class="acct-form" data-kind="employee">' +
      '<select name="role" title="账户身份">' +
      '<option value="teacher">班主任</option><option value="staff">顾问</option></select>' +
      '<input name="real_name" placeholder="姓名，如 周老师 / 周顾问" maxlength="20">' +
      '<input name="username" placeholder="登录账号" maxlength="20">' +
      '<input name="department" placeholder="部门 / 方向（可空）" maxlength="40">' +
      '<input name="contact" placeholder="手机号（可空）" maxlength="20">' +
      '<button type="submit">开账户</button></form>' +
      '<div class="acct-hint">新账户初始密码 123456。姓名统一写「姓+老师 / 姓+顾问」（如 周老师、周顾问），' +
      "登录页的账号卡片才整齐。班主任开的班由顾问在下方分配；顾问只带自己的线索，学员账户由顾问开。</div>";
  }

  function classBlockHtml(d) {
    var classes = d.classes || [];
    var teachers = d.teachers || [];
    var can = !!d.can_manage_class;
    var head = '<div class="cls-head"><b>班级与班主任</b><span>' +
      (can
        ? "一个班只对应一位班主任；换老师后，这个班的学生（含请假、成绩）一起转过去；" +
          "试听班由活动项目老师带，成员是有联系方式、未流失的意向学员"
        : "班级与班主任由顾问维护，这里只查看") + "</span></div>";

    var rows = classes.map(function (c) {
      var isTrial = (c.kind || "常规班") === "试听班";
      var trial = c.trial || {};
      var meta = isTrial
        ? "试听班 · 待签约 " + (trial.pending || 0) + " · 已签约 " + (trial.signed || 0)
        : c.students + " 名学生" + (c.grade ? " · " + escapeHtml(c.grade) : "");
      // 试听班只列活动项目老师，常规班只列班主任：两边的责任不串味
      var pool = teachers.filter(function (t) {
        return isTrial ? !!t.is_activity : !t.is_activity;
      });
      var opts = pool.map(function (t) {
        var taken = t.class_id && t.class_id !== c.id;
        return '<option value="' + t.id + '"' + (t.id === c.teacher_id ? " selected" : "") +
          (taken ? ' data-swap="' + escapeHtml(t.class_name) + '"' : "") + ">" + escapeHtml(t.name) +
          (t.id === c.teacher_id
            ? "（现在带这个班）"
            : taken
              ? "（现带 " + escapeHtml(t.class_name) + "，选择后对调）"
              : "（未带班）") +
          "</option>";
      }).join("") || '<option value="">暂无可选老师</option>';
      return '<div class="cls-row">' +
        '<span class="cls-name">' + escapeHtml(c.name) + "</span>" +
        '<span class="cls-meta">' + meta + "</span>" +
        (can
          ? '<select data-cls="' + c.id + '" title="换班主任">' + opts + "</select>" +
            '<button type="button" data-act="cls-teacher" data-id="' + c.id +
            '" data-name="' + escapeHtml(c.name) + '">调整</button>'
          : '<span class="cls-meta">班主任 ' + escapeHtml(c.teacher) + "</span>") +
        "</div>";
    }).join("");

    // 开新班默认是常规班，空闲班主任里排除活动项目老师
    var free = teachers.filter(function (t) { return !t.class_id && !t.is_activity; });
    // 班名按「粤教N班」接着排，直接把下一个班号填进框里，不用自己想。
    // 同时关掉浏览器记住的历史输入（之前那些跟班级无关的词就会顶掉）。
    var maxNo = 0;
    classes.forEach(function (c) {
      var m = /^粤教\s*(\d+)\s*班$/.exec((c.name || "").trim());
      if (m) maxNo = Math.max(maxNo, parseInt(m[1], 10));
    });
    var suggest = "粤教" + (maxNo + 1) + "班";
    var nameOpts = [0, 1, 2].map(function (i) {
      return '<option value="粤教' + (maxNo + 1 + i) + '班"></option>';
    }).join("");
    var addForm = can
      ? '<form class="cls-new" data-kind="class">' +
        '<input name="name" list="cls-name-opts" value="' + suggest + '" placeholder="如 ' + suggest +
        '" maxlength="20" autocomplete="off" spellcheck="false" title="班名按粤教N班接着排，可自己改">' +
        '<datalist id="cls-name-opts">' + nameOpts + "</datalist>" +
        '<select name="teacher_id" title="班主任">' +
        (free.length
          ? free.map(function (t) {
              return '<option value="' + t.id + '">' + escapeHtml(t.name) + "</option>";
            }).join("")
          : '<option value="">没有空闲班主任</option>') +
        "</select>" +
        '<button type="submit"' + (free.length ? "" : " disabled") + ">开班</button></form>" +
        (free.length
          ? ""
          : '<div class="cls-meta" style="margin-top:6px">所有班主任都已带班；要开新班，' +
            "先让管理员在账户管理里开一位班主任。</div>")
      : "";

    return '<div class="cls-box">' + head +
      '<div class="cls-rows">' + (rows || '<div class="ws-empty">还没有班级</div>') + "</div>" +
      addForm + "</div>";
  }

  function onClassPick(sel) {
    var form = sel.closest("form");
    if (!form) return;
    var hint = form.nextElementSibling;
    var opt = sel.options[sel.selectedIndex];
    if (!hint || !hint.classList.contains("class-hint") || !opt) return;
    var name = opt.value ? opt.textContent.split(" · ")[0] : "";
    var teacher = opt.getAttribute("data-teacher") || "";
    hint.textContent = name
      ? "班级决定班主任：" + name + " 归 " + teacher +
        " 负责，这位学员的请假和成绩自动归他；一个班只对应一位老师，不能交叉。"
      : "还没有班级。先在下面「班级与班主任」里开班，再回来开学员。";
  }

        '<span class="ws-meta">' + escapeHtml(a.username) + "</span>" +

  function renderAccountsPanel() {

    el.panelTitle.textContent = base.title || "账户管理";
    el.panelSub.textContent = "读取中…";

      .then(function (d) {
        var rows = d.rows || [];

          (st.disabled ? " · " + st.disabled + " 个已停用" : "");

  function createAccount(form) {
    if (form.getAttribute("data-busy") === "1") return;
    form.setAttribute("data-busy", "1");
    var kind = form.getAttribute("data-kind");
    function val(n) {
      var box = form.querySelector('[name="' + n + '"]');
      return box ? (box.value || "").trim() : "";
    }
    var body = {
      role: kind === "student" ? "student" : val("role"),
      real_name: val("real_name"),
      username: val("username"),
      department: val("department"),
      contact: val("contact"),
    };
    if (kind === "student") {
      if (!val("class_id")) { toast("请先选班级（没有班就先在下面开班）", true); return; }
      body.class_id = Number(val("class_id"));
    }
    if (!body.real_name) { toast("请填姓名", true); return; }
    if (!body.username) { toast("请填登录账号", true); return; }

    var btn = form.querySelector("button");
    btn.disabled = true;
    fetch("/api/accounts", {
      method: "POST",
      headers: wsHeaders(),
      body: JSON.stringify(body),
    })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg || "已开户");
        renderAccountsPanel();
      })
      .catch(function (e) {
        form.setAttribute("data-busy", "0");
        btn.disabled = false;
        toast("开户失败：" + (e.message || e), true);
      });
  }

  function createClass(form) {
    if (form.getAttribute("data-busy") === "1") return;
    var name = (form.querySelector('[name="name"]').value || "").trim();
    var tid = form.querySelector('[name="teacher_id"]').value;
    if (!name) { toast("请填班级名称", true); return; }
    if (!tid) { toast("没有空闲班主任，先让管理员开一个老师账号", true); return; }

    form.setAttribute("data-busy", "1");
    var btn = form.querySelector("button");
    btn.disabled = true;
    fetch("/api/accounts/classes", {
      method: "POST",
      headers: wsHeaders(),
      body: JSON.stringify({ name: name, teacher_id: Number(tid), grade: "" }),
    })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg || "已开班");
        renderAccountsPanel();
      })
      .catch(function (e) {
        form.setAttribute("data-busy", "0");
        btn.disabled = false;
        toast("开班失败：" + (e.message || e), true);
      });
  }

  function changeClassTeacher(btn) {
    if (btn.disabled) return;
    var row = btn.closest(".cls-row");
    var sel = row ? row.querySelector("select") : null;
    if (!sel || !sel.value) return;
    var opt = sel.options[sel.selectedIndex];
    var who = opt.textContent.split("（")[0];
    var swap = opt.getAttribute("data-swap");
    var name = row.querySelector(".cls-name").textContent;
    var tip = swap
      ? "这位老师现在带「" + swap + "」，调整后两个班对调：学生（含请假、成绩）跟着换老师。"
      : "班上的学生（含请假、成绩）会一起转到这位老师名下。";
    if (!window.confirm("把「" + name + "」交给 " + who + "？\n" + tip)) return;

    btn.disabled = true;
    fetch("/api/accounts/classes/" + btn.getAttribute("data-id") + "/teacher", {
      method: "POST",
      headers: wsHeaders(),
      body: JSON.stringify({ teacher_id: Number(sel.value) }),
    })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg || "已调整");
        renderAccountsPanel();
      })
      .catch(function (e) {
        btn.disabled = false;
        toast("调整失败：" + (e.message || e), true);
      });
  }

  function toggleAccount(id, act, btn) {
    if (btn.disabled) return;
    var word = act === "disable" ? "停用" : "启用";
    if (act === "disable" && !window.confirm("停用后该账号将无法登录，需要在这里重新启用。确定？")) return;
    btn.disabled = true;
    fetch("/api/accounts/" + id + "/status", {
      method: "POST",
      headers: wsHeaders(),
      body: JSON.stringify({ action: act }),
    })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg || ("已" + word));
        renderAccountsPanel();
      })
      .catch(function (e) {
        btn.disabled = false;
        toast(word + "失败：" + (e.message || e), true);
      });
  }

  function removeAccount(id, name, btn) {
    if (btn.disabled) return;
    if (!window.confirm("删除账户「" + name + "」后，该账号将无法登录（历史请假 / 成绩 / 日志保留）。确定删除？")) return;
    btn.disabled = true;
    fetch("/api/accounts/" + id, { method: "DELETE", headers: wsHeaders() })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg || "已删除");
        renderAccountsPanel();
      })
      .catch(function (e) {
        btn.disabled = false;
        toast("删除失败：" + (e.message || e), true);
      });
  }

  function openPanel(key) {
    if (!state.user) return;
    state.panelKey = key;
    el.panel.hidden = false;
    el.chat.hidden = true;
    el.composer.hidden = true;
    renderNavs(state.ws);
    renderPanel();
    if (state.panelKey !== "logs" && state.panelKey !== "grades" &&
        state.panelKey !== "accounts" && state.panelKey !== "activities") loadWs();
  }

  function closePanel() {
    state.panelKey = null;
    el.panel.hidden = true;
    el.chat.hidden = false;
    el.composer.hidden = false;
    renderNavs(state.ws);
    el.input.focus();
  }

  function initWs() {
    if (!state.user) return;
    el.wsBtn.hidden = false;
    el.navBlock.hidden = false;
    el.wsLabel.textContent = WS_LABEL[state.user.role] || "我的工作台";
    el.wsBtn.title = state.user.role_desc || "";
    loadWs();
  }

  function saveLead(box) {
    var id = box.getAttribute("data-lead");
    var sel = box.querySelector("select");
    var note = box.querySelector("input");
    var btn = box.querySelector("button");
    btn.disabled = true;
    fetch("/api/workspace/lead/" + id + "/follow", {
      method: "POST",
      headers: wsHeaders(),
      body: JSON.stringify({ note: note.value.trim(), status: sel.value }),
    })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg || "已保存");
        loadWs();
      })
      .catch(function (e) {
        btn.disabled = false;
        toast("保存失败：" + (e.message || e), true);
      });
  }

  function decideLeave(id, approved, btn) {
    var box = btn.parentNode;
    Array.prototype.forEach.call(box.querySelectorAll("button"), function (b) { b.disabled = true; });
    fetch("/api/leave/approve", {
      method: "POST",
      headers: wsHeaders(),
      body: JSON.stringify({
        record_id: Number(id),
        approver_id: state.user ? state.user.id : 0,
        approved: approved,
        comment: "",
      }),
    })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg || "已处理");
        loadWs();
        updateApproveEntry();
      })
      .catch(function (e) {
        Array.prototype.forEach.call(box.querySelectorAll("button"), function (b) { b.disabled = false; });
        toast("审批失败：" + (e.message || e), true);
      });
  }

  function panelClickHandler(ev) {
    var alBtn = ev.target.closest("[data-alert-act]");
    if (alBtn) {
      handleAlert(alBtn.getAttribute("data-alert-id"), alBtn.getAttribute("data-alert-act"), alBtn);
      return;
    }
    var jrBtn = ev.target.closest("[data-jr-act]");
    if (jrBtn) {
      handleJournal(jrBtn.getAttribute("data-jr-id"), jrBtn.getAttribute("data-jr-act"), jrBtn);
      return;
    }
    var jrChip = ev.target.closest("[data-jr-group]");
    if (jrChip) {
      var group = jrChip.getAttribute("data-jr-group");
      var form = jrChip.closest("form");
      if (form) {
        Array.prototype.forEach.call(
          form.querySelectorAll('.jr-chip[data-jr-group="' + group + '"]'),
          function (b) { b.classList.remove("on"); }
        );
      }
      jrChip.classList.add("on");
      return;
    }
    var fbBtn = ev.target.closest("[data-fb-act]");
    if (fbBtn) {
      handleFeedback(fbBtn.getAttribute("data-fb-id"), fbBtn.getAttribute("data-fb-act"), fbBtn);
      return;
    }
    var fbCat = ev.target.closest("[data-fb-cat]");
    if (fbCat) {
      var box = fbCat.closest(".fb-cats");
      Array.prototype.forEach.call(box.querySelectorAll(".fb-cat"), function (b) {
        b.classList.remove("on");
      });
      fbCat.classList.add("on");
      return;
    }
    var edit = ev.target.closest(".g-edit");
    if (edit) { startScoreEdit(edit); return; }
    var save = ev.target.closest(".g-save");
    if (save) { saveScoreEdit(save); return; }
    var cancel = ev.target.closest(".g-cancel");
    if (cancel) { renderGradesPanel(); return; }
    var del = ev.target.closest(".g-del");
    if (del) { deleteGrade(del.getAttribute("data-score"), del); return; }
    var actBtn = ev.target.closest(".act-item [data-act]");
    if (actBtn) { handleActAction(actBtn); return; }
    var clsBtn = ev.target.closest('[data-act="cls-teacher"]');
    if (clsBtn) { changeClassTeacher(clsBtn); return; }
    var acct = ev.target.closest(".acct-acts button");
    if (acct) {
      var aid = acct.getAttribute("data-id");
      var aact = acct.getAttribute("data-act");
      if (aact === "delete") removeAccount(aid, acct.closest(".ws-item").querySelector("b").textContent, acct);
      else toggleAccount(aid, aact, acct);
      return;
    }
    var saveLeadBtn = ev.target.closest(".ws-follow .save");
    if (saveLeadBtn) { saveLead(saveLeadBtn.closest(".ws-follow")); return; }
    var act = ev.target.closest(".ws-acts button");
    if (act && act.parentNode.getAttribute("data-leave")) {
      decideLeave(act.parentNode.getAttribute("data-leave"), act.className === "ok", act);
    }
  }

  el.navs.addEventListener("click", function (ev) {
    var n = ev.target.closest(".nav");
    if (!n) return;
    var key = n.getAttribute("data-key");
    if (state.panelKey === key) { closePanel(); return; }
    openPanel(key);
  });

  el.panelBack.addEventListener("click", closePanel);
  el.panelBody.addEventListener("click", panelClickHandler);
  el.panelBody.addEventListener("input", function (ev) {
    var s = ev.target && ev.target.closest
      ? ev.target.closest('.jr-form input[name="mood_score"]') : null;
    if (!s) return;
    var out = s.parentNode.querySelector("output");
    if (out) out.textContent = s.value;
  });
  el.panelBody.addEventListener("change", function (ev) {
    var sel = ev.target && ev.target.closest ? ev.target.closest("select") : null;
    if (!sel) return;
    if (sel.closest(".act-form")) onActPick(sel);
    else if (sel.name === "class_id") onClassPick(sel);
  });
  el.panelBody.addEventListener("focusout", function (ev) {
    var box = ev.target;
    if (!box || !box.name || !/_custom$/.test(box.name)) return;
    if ((box.value || "").trim()) return;
    var form = box.closest("form");
    if (!form) return;
    var sel = form.querySelector('select[name="' + box.name.replace(/_custom$/, "") + '"]');
    if (sel) { sel.hidden = false; sel.value = ""; }
    box.hidden = true;
  });
  el.panelBody.addEventListener("submit", function (ev) {
    var jr = ev.target.closest(".jr-form");
    if (jr) {
      ev.preventDefault();
      submitJournal(jr);
      return;
    }
    var fb = ev.target.closest(".fb-form");
    if (fb) {
      ev.preventDefault();
      submitFeedback(fb);
      return;
    }
    var acct = ev.target.closest(".acct-form");
    if (acct) {
      ev.preventDefault();
      var kind = acct.getAttribute("data-kind");
      if (kind === "activity") createActivity(acct);
      else if (kind === "class") createClass(acct);
      else createAccount(acct);
      return;
    }
    var form = ev.target.closest(".g-form");
    if (!form) return;
    ev.preventDefault();
    saveGrade(form);
  });
  el.panelBody.addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter") return;
    var score = ev.target.closest(".g-input");
    if (score) {
      ev.preventDefault();
      var btn = score.closest(".g-row").querySelector(".g-save");
      if (btn) saveScoreEdit(btn);
      return;
    }
    var note = ev.target.closest(".ws-follow .note");
    if (!note) return;
    ev.preventDefault();
    saveLead(note.closest(".ws-follow"));
  });

  // 窄屏侧栏隐藏时，用右上角按钮直接进事项页
  el.wsBtn.addEventListener("click", function () {
    var base = (NAV_ITEMS[state.user && state.user.role] || [])[0];
    openPanel(base ? base.key : "logs");
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (state.panelKey) closePanel();
    if (el.drawer && el.drawer.classList.contains("on")) closeDrawer();
  });

  /* ---------------- 发送 ---------------- */
  function send(text) {
    if (state.streaming) return;
    text = (text || el.input.value).trim();
    if (!text) return;

    var empty = el.chat.querySelector(".empty");
    if (empty) el.chat.innerHTML = "";

    addUserMsg(text);
    el.input.value = "";
    autoGrow();

    var ref = addBotMsg();
    setStreaming(true);
    state.controller = new AbortController();

    fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        agent: state.agent.key,
        query: text,
        user_id: Number(state.userId),
        conversation_id: state.conversationId || "",
        token: token(),
      }),
      signal: state.controller.signal,
    })
      .then(function (res) {
        if (!res.ok || !res.body) {
          return res.text().then(function (t) {
            throw new Error("HTTP " + res.status + " " + t.slice(0, 200));
          });
        }
        var reader = res.body.getReader();
        var decoder = new TextDecoder("utf-8");
        var buffer = "";

        function pump() {
          return reader.read().then(function (r) {
            if (r.done) return;
            buffer += decoder.decode(r.value, { stream: true });
            var idx;
            while ((idx = buffer.indexOf("\n\n")) >= 0) {
              handleFrame(buffer.slice(0, idx), ref);
              buffer = buffer.slice(idx + 2);
            }
            return pump();
          });
        }
        return pump();
      })
      .catch(function (e) {
        if (e.name === "AbortError") {
          finishBotMsg(ref, null, null);
          ref.meta.hidden = false;
          ref.meta.textContent = "已停止";
        } else {
          finishBotMsg(ref, null, e.message || String(e));
        }
      })
      .finally(function () {
        setStreaming(false);
      });
  }

  function handleFrame(frame, ref) {
    var evt = "", data = "";
    frame.split("\n").forEach(function (line) {
      if (line.indexOf("event:") === 0) evt = line.slice(6).trim();
      else if (line.indexOf("data:") === 0) data += line.slice(5).trim();
    });
    if (!data) return;

    var obj;
    try { obj = JSON.parse(data); } catch (e) { return; }

    if (evt === "delta") {
      ref.text += obj.text || "";
      ref.body.innerHTML = renderMarkdown(tidyAnswer(ref.text));
      scrollBottom(false);
    } else if (evt === "node") {
      pushTool(ref, obj.title);
    } else if (evt === "done") {
      if (obj.conversation_id) {
        state.conversationId = obj.conversation_id;
        el.hintConv.textContent = "会话 " + obj.conversation_id.slice(0, 8);
      }
      finishBotMsg(ref, obj.usage, null);
    } else if (evt === "error") {
      finishBotMsg(ref, null, obj.message || "出错了");
    }
  }

  function setStreaming(on) {
    state.streaming = on;
    el.send.textContent = on ? "停止" : "发送";
    el.send.classList.toggle("stop", on);
    el.input.disabled = on;
  }

  /* ---------------- 切换 ---------------- */
  function switchAgent(key) {
    if (state.streaming) return;
    closeDrawer();
    if (state.panelKey) closePanel();
    if (state.panelKey) closePanel();
    state.agent = state.agents.filter(function (a) { return a.key === key; })[0];
    state.userId = state.agent.users[0].id;
    state.conversationId = "";
    el.hintConv.textContent = "";
    document.documentElement.style.setProperty("--accent", state.agent.accent);
    el.headEmoji.textContent = state.agent.icon;
    el.headName.textContent = state.agent.name;
    el.headTag.textContent = state.agent.tagline;
    el.headEmoji.style.background = state.agent.accent + "18";
    renderAgents();
    renderQuicks();
    renderUsers();
    updateApproveEntry();
    emptyState();
    el.input.focus();
  }

  /* ---------------- 输入框 ---------------- */
  function autoGrow() {
    el.input.style.height = "auto";
    el.input.style.height = Math.min(el.input.scrollHeight, 132) + "px";
  }

  el.input.addEventListener("input", autoGrow);
  el.input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  el.send.addEventListener("click", function () {
    if (state.streaming) {
      if (state.controller) state.controller.abort();
      return;
    }
    send();
  });
  el.clearBtn.addEventListener("click", function () {
    if (state.streaming) return;
    state.conversationId = "";
    el.hintConv.textContent = "";
    emptyState();
  });
  el.userSelect.addEventListener("change", function () {
    state.userId = Number(el.userSelect.value);
    state.conversationId = "";
    renderUsers();
    updateApproveEntry();
    emptyState();
  });

  el.logoutBtn.addEventListener("click", function () {
    if (state.streaming && state.controller) state.controller.abort();
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem("yj_user");
    fetch("/api/auth/logout", { method: "POST" }).catch(function () {});
    location.replace("/");
  });

  /* ---------------- 启动：先校验登录，再按角色裁剪 ---------------- */
  function boot() {
    if (!token()) {
      location.replace("/?next=" + encodeURIComponent("/demo/"));
      return;
    }
    fetch("/api/auth/me", { headers: { Authorization: "Bearer " + token() } })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.detail || "登录已过期");
          return d.data;
        });
      })
      .then(function (user) {
        state.user = user;
        state.perms = user.features || {};
        renderMe();
        initWs();
        // 数据后台只对管理员开放
        if (state.perms && state.perms.admin) {
          var adminLink = document.getElementById("admin-link");
          if (adminLink) adminLink.hidden = false;
        }
        return fetch("/api/chat/agents")
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var allowed = user.agents || [];
            state.agents = (d.data || []).filter(function (a) {
              return allowed.indexOf(a.key) >= 0;
            });
            if (!state.agents.length) throw new Error("当前角色没有可用的 Agent");
            if (!state.perms.switch_identity) {
              // 非管理员：身份锁死本人，前端不给"切成别人"的入口
              state.agents.forEach(function (a) {
                var mine = a.users.filter(function (u) { return u.id === user.id; })[0];
                a.users = [mine || { id: user.id, name: user.real_name, label: user.label }];
              });
            }
            switchAgent(state.agents[0].key);
            setStreaming(false);
          });
      })
      .catch(function (e) {
        var msg = e.message || String(e);
        if (/登录|过期|401/.test(msg)) {
          localStorage.removeItem(TOKEN_KEY);
          location.replace("/");
          return;
        }
        el.headTag.textContent = "连接后端失败";
        el.chat.innerHTML =
          '<div class="empty"><div class="empty-emoji">⚠️</div>' +
          '<div class="empty-title">无法进入控制台</div>' +
          '<div class="empty-text">' + escapeHtml(msg) + "</div></div>";
      });
  }

  boot();
})();
</script>
