<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>粤教服务 · 智能体中台</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --line: #e5e7eb;
    --line-soft: #eef0f3;
    --text: #1f2430;
    --text-soft: #6b7280;
    --text-faint: #9aa1ac;
    --accent: #2563eb;
    --accent-weak: #eef3ff;
    --danger: #dc2626;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
    --shadow-md: 0 8px 24px rgba(16, 24, 40, 0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  button { font-family: inherit; }

  .app {
    display: flex;
    height: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px;
    gap: 16px;
  }

  /* ---------------- 侧边栏 ---------------- */
  .side {
    width: 272px;
    flex: 0 0 272px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    height: 100%;
    overflow-y: auto;
    padding-right: 4px;
    scrollbar-width: thin;
  }
  .side::-webkit-scrollbar { width: 5px; }
  .side::-webkit-scrollbar-thumb { background: #d9e4e1; border-radius: 5px; }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 6px;
  }
  .brand-logo {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 15px;
    letter-spacing: 0.5px;
  }
  .brand-title { font-size: 15px; font-weight: 650; letter-spacing: 0.2px; }
  .brand-sub { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }

  .agents { display: flex; flex-direction: column; gap: 8px; }

  .agent {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: var(--radius);
    cursor: pointer;
    text-align: left;
    transition: border-color .15s, box-shadow .15s, transform .15s;
    box-shadow: var(--shadow-sm);
  }
  .agent:hover { border-color: #cfd6e4; transform: translateY(-1px); }
  .agent.on {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-weak);
  }
  .agent-emoji { font-size: 18px; line-height: 1.2; margin-top: 1px; }
  .agent-body { flex: 1; min-width: 0; }
  .agent-name { display: block; font-weight: 620; font-size: 13.5px; }
  .agent-tag { display: block; font-size: 11.5px; color: var(--text-soft); margin-top: 4px; line-height: 1.55; }

  .side-block {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: var(--shadow-sm);
  }
  .side-label { display: flex; align-items: center; }
  .side-label em { margin-left: auto; font-style: normal; font-size: 10.5px; color: var(--accent); }
  .todo-block { padding-bottom: 10px; }
  .todos { display: flex; flex-direction: column; gap: 6px; max-height: 228px; overflow-y: auto; }
  .todos::-webkit-scrollbar { width: 5px; }
  .todos::-webkit-scrollbar-thumb { background: #d9e4e1; border-radius: 5px; }
  .todo {
    border: 1px solid var(--line); background: #fff; border-radius: 8px;
    padding: 7px 8px; cursor: pointer; transition: border-color .14s, background .14s;
  }
  .todo:hover { border-color: var(--accent); background: #fbfdfc; }
  .todo-h { display: flex; align-items: center; gap: 6px; }
  .todo-h b { font-size: 12px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .todo-h .pill { margin-left: auto; font-size: 10px; padding: 1px 5px; }
  .todo-m {
    font-size: 10.5px; color: var(--text-faint); margin-top: 4px; line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .todo-a { display: flex; gap: 5px; margin-top: 6px; }
  .todo-a button {
    flex: 1; height: 24px; font-size: 11px; font-family: inherit; cursor: pointer;
    border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--text-soft);
  }
  .todo-a button.ok { border-color: #b7e4cb; background: #f2fbf5; color: #15803d; }
  .todo-a button.no { border-color: #f3c6c6; background: #fff7f7; color: #b91c1c; }
  .todo-a button:disabled { opacity: .5; cursor: default; }
  .todo-empty { font-size: 11.5px; color: var(--text-faint); padding: 6px 2px; }
  .side-more {
    width: 100%; margin-top: 7px; height: 27px; font: inherit; font-size: 11px;
    border: 1px dashed var(--line); background: transparent; color: var(--text-soft);
    border-radius: 7px; cursor: pointer;
  }
  .side-more:hover { border-color: var(--accent); color: var(--accent); }
  .side-log {
    width: 100%; height: 34px; display: flex; align-items: center; justify-content: space-between;
    background: var(--panel);
    font: inherit; font-size: 11.5px; padding: 0 10px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--text-soft); border-radius: 8px;
  }
  .side-log:hover { border-color: var(--accent); color: var(--accent); }
  .side-log i { font-style: normal; font-size: 10.5px; color: var(--text-faint); }
  /* 左栏导航卡：只是入口，点进去才处理 */
  .navs { display: flex; flex-direction: column; gap: 6px; }
  .nav {
    position: relative; display: flex; align-items: center; gap: 9px; width: 100%;
    text-align: left; font: inherit; cursor: pointer;
    border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 8px 10px;
    transition: border-color .14s, background .14s;
  }
  .nav:hover { border-color: var(--accent); background: #fbfdfc; }
  .nav.on { border-color: var(--accent); background: var(--accent-weak); }
  .nav .ic {
    flex: 0 0 26px; width: 26px; height: 26px; border-radius: 7px;
    display: grid; place-items: center; font-size: 13px;
    background: var(--accent-weak); color: var(--accent);
  }
  .nav .nb { flex: 1; min-width: 0; }
  .nav .nb b { display: block; font-size: 12.5px; font-weight: 600; color: var(--text); }
  .nav .nb span {
    display: block; font-size: 10.5px; color: var(--text-faint); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .nav-badge {
    position: absolute; top: 7px; right: 8px; min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 9px; background: #dc2626; color: #fff;
    font-size: 10px; line-height: 16px; text-align: center; font-style: normal;
  }
  .nav-badge[hidden] { display: none; }

  /* 主区域的事项面板 */
  .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .panel[hidden] { display: none; }
  .panel-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--line-soft); background: #fff;
  }
  .panel-back {
    height: 30px; padding: 0 11px; font: inherit; font-size: 12px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--text-soft); border-radius: 7px;
    white-space: nowrap; flex: 0 0 auto;
  }
  .panel-back:hover { border-color: var(--accent); color: var(--accent); }
  .panel-meta { min-width: 0; }
  .panel-meta b { font-size: 15px; font-weight: 650; }
  .panel-meta span { font-size: 11.5px; color: var(--text-faint); margin-left: 8px; }
  .panel-body { flex: 1; overflow-y: auto; padding: 16px 20px 28px; }
  .panel-body::-webkit-scrollbar { width: 8px; }
  .panel-body::-webkit-scrollbar-thumb { background: #dfe8e5; border-radius: 8px; }
  .chat[hidden], .composer[hidden] { display: none !important; }

  /* 桌面端把右上角工作台按钮收掉，入口在左栏；窄屏侧栏隐藏时用它兜底 */
  @media (min-width: 861px) { .ws-btn { display: none !important; } }
  @media (max-width: 860px) {
    .ws-btn span#ws-label { display: none; }
    .ws-btn::before { content: "☰"; font-size: 13px; }
  }
  @media (max-width: 640px) {
    .head { flex-wrap: wrap; row-gap: 8px; }
    .head-right { margin-left: 0; width: 100%; justify-content: flex-end; }
    .head-tag { display: none; }
  }
  @media (max-width: 640px) {
    .head { flex-wrap: wrap; row-gap: 8px; }
    .head-right { margin-left: 0; width: 100%; justify-content: flex-end; }
    .head-tag { display: none; }
  }

  .side-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-faint);
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin: 0 0 8px;
  }

  .quicks { display: flex; flex-direction: column; gap: 2px; max-height: 320px; overflow-y: auto; }
  .quick {
    border: none;
    background: transparent;
    text-align: left;
    padding: 7px 8px;
    border-radius: 8px;
    font-size: 12.5px;
    color: #3f4654;
    cursor: pointer;
    line-height: 1.5;
    transition: background .12s, color .12s;
  }
  .quick:hover { background: #f3f5f9; color: var(--accent); }

  .side-foot {
    margin-top: auto;
    font-size: 11.5px;
    color: var(--text-faint);
    line-height: 1.7;
    padding: 0 4px;
  }
  .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #22c55e;
    margin-right: 5px;
    vertical-align: 1px;
  }

  /* ---------------- 主区 ---------------- */
  .main {
    flex: 1;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }

  .head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line-soft);
  }
  .head-emoji {
    width: 34px; height: 34px;
    border-radius: 10px;
    display: grid; place-items: center;
    font-size: 17px;
    background: var(--accent-weak);
  }
  .head-name { font-weight: 640; font-size: 14.5px; }
  .head-tag { font-size: 11.5px; color: var(--text-soft); margin-top: 2px; }
  .head-right { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .head-right > * { flex: 0 0 auto; white-space: nowrap; }
  @media (max-width: 1180px) {
    .head-right { gap: 6px; }
    .ghost-btn { padding: 0 8px; font-size: 12px; }
    .me { padding: 0 8px 0 4px; }
    .me-info i { display: none; }
    #user-select { max-width: 170px; }
    /* 1080 这类窄桌面：清空对话让位，避免顶栏溢出到屏幕外 */
    .head-right .ghost-btn#clear-btn { display: none; }
  }
  @media (max-width: 980px) {
    .head-right .ghost-btn#clear-btn { display: none; }
  }

  select, .ghost-btn {
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: #374151;
    font-size: 12.5px;
    padding: 0 10px;
    cursor: pointer;
    outline: none;
  }
  select:hover, .ghost-btn:hover { border-color: #c7ced9; background: #fbfcfe; }
  .ghost-btn.danger:hover { color: var(--danger); border-color: #f3c6c6; background: #fff7f7; }
  select[hidden] { display: none; }

  /* ---------------- 当前登录用户 ---------------- */
  .me {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 11px 0 4px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
  }
  .me-avatar {
    width: 24px; height: 24px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff;
    font-size: 11.5px;
    font-weight: 600;
  }
  .me-info { display: flex; align-items: center; gap: 6px; line-height: 1; }
  .me-info b { font-size: 12.5px; font-weight: 600; color: #2b3241; }
  .me-info i {
    font-style: normal;
    font-size: 10.5px;
    color: var(--accent);
    background: var(--accent-weak);
    border-radius: 999px;
    padding: 2.5px 7px;
    white-space: nowrap;
  }

  /* ---------------- 对话 ---------------- */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px 24px 8px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb { background: #dfe3ea; border-radius: 8px; }

  .empty {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }
  .empty-emoji { font-size: 40px; margin-bottom: 14px; }
  .empty-title { font-size: 16px; font-weight: 620; margin-bottom: 8px; }
  .empty-text { font-size: 13px; color: var(--text-soft); max-width: 460px; line-height: 1.8; }
  .empty-chips {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-top: 18px; max-width: 560px;
  }
  .chip {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 12.5px;
    color: #444c5c;
    cursor: pointer;
    transition: all .13s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-weak); }

  .msg { display: flex; gap: 10px; margin-bottom: 22px; }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 30px; height: 30px;
    flex: 0 0 30px;
    border-radius: 9px;
    display: grid; place-items: center;
    font-size: 14px;
    background: #f0f2f6;
  }
  .msg.user .avatar { background: #e6ecff; }

  .bubble-wrap { max-width: min(76%, 720px); min-width: 0; }
  .msg.user .bubble-wrap { display: flex; flex-direction: column; align-items: flex-end; }

  .who { font-size: 11.5px; color: var(--text-faint); margin-bottom: 5px; }

  .bubble {
    padding: 11px 14px;
    border-radius: 12px;
    background: #fff;
    border: 1px solid var(--line-soft);
    line-height: 1.75;
    font-size: 13.5px;
    word-break: break-word;
    box-shadow: var(--shadow-sm);
  }
  .msg.user .bubble {
    background: var(--accent);
    border-color: transparent;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble { border-bottom-left-radius: 4px; }

  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble h4 { margin: 12px 0 6px; font-size: 13.5px; }
  .bubble h4:first-child { margin-top: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 20px; }
  .bubble li { margin: 2px 0; }
  .bubble code {
    background: #f2f4f8;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .bubble pre {
    background: #f7f8fa;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .bubble pre code { background: none; padding: 0; }
  .bubble strong { font-weight: 640; }
  .msg.user .bubble code { background: rgba(255,255,255,.18); color: #fff; }

  .tools {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 8px;
  }
  .tool {
    font-size: 11px;
    color: #445;
    background: #f3f5f9;
    border: 1px solid var(--line-soft);
    border-radius: 6px;
    padding: 2px 7px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .tool.active { color: var(--accent); background: var(--accent-weak); border-color: #d6e2ff; }
  .tool .mini-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: currentColor; opacity: .75;
  }

  .meta {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 6px;
    display: flex; gap: 12px; flex-wrap: wrap;
  }

  .cursor::after {
    content: "";
    display: inline-block;
    width: 6px; height: 14px;
    background: var(--accent);
    vertical-align: -2px;
    margin-left: 2px;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }

  .err {
    color: #b42318;
    background: #fff6f5;
    border: 1px solid #fbd6d2;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12.5px;
  }

  /* ---------------- 输入区 ---------------- */
  .composer {
    border-top: 1px solid var(--line-soft);
    padding: 12px 20px 14px;
    background: #fff;
  }
  .input-shell {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 8px 8px 12px;
    transition: border-color .15s, box-shadow .15s;
    background: #fff;
  }
  .input-shell:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-weak);
  }
  textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--text);
    background: transparent;
    max-height: 132px;
    padding: 3px 0;
  }
  textarea::placeholder { color: #aab1bd; }

  .send {
    flex: 0 0 auto;
    height: 34px;
    padding: 0 16px;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 550;
    cursor: pointer;
    transition: opacity .15s, background .15s;
  }
  .send:hover { filter: brightness(1.05); }
  .send:disabled { background: #c9d0dc; cursor: not-allowed; }
  .send.stop { background: #374151; }

  .hint {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-faint);
    padding: 7px 4px 0;
  }

  /* ---------------- 审批抽屉 ---------------- */
  .approve-btn { position: relative; display: inline-flex; align-items: center; gap: 6px; }
  .approve-btn[hidden] { display: none; }
  .badge {
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 999px;
    background: #dc2626;
    color: #fff;
    font-size: 10.5px;
    line-height: 16px;
    text-align: center;
    font-style: normal;
  }
  .badge[hidden] { display: none; }

  .drawer-mask {
    position: fixed;
    inset: 0;
    background: rgba(17, 24, 39, .34);
    z-index: 40;
    animation: fade .18s ease;
  }
  .drawer-mask[hidden] { display: none; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .drawer {
    position: fixed;
    top: 0; right: 0;
    height: 100%;
    width: min(440px, 100vw);
    background: #fff;
    z-index: 41;
    display: flex;
    flex-direction: column;
    box-shadow: -12px 0 32px rgba(16, 24, 40, .14);
    transform: translateX(100%);
    transition: transform .22s ease;
  }
  .drawer.on { transform: translateX(0); }

  .drawer-head {
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .drawer-title { font-size: 15px; font-weight: 650; }
  .drawer-sub { font-size: 11.5px; color: var(--text-soft); margin-top: 4px; line-height: 1.6; }
  .drawer-close {
    margin-left: auto;
    border: none;
    background: transparent;
    font-size: 18px;
    line-height: 1;
    color: var(--text-faint);
    cursor: pointer;
    padding: 2px 4px;
  }
  .drawer-close:hover { color: var(--text); }

  .drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 18px 28px;
  }
  .drawer-body::-webkit-scrollbar { width: 8px; }
  .drawer-body::-webkit-scrollbar-thumb { background: #e2e6ee; border-radius: 8px; }

  .dr-stats { display: flex; gap: 8px; margin-bottom: 16px; }
  .dr-stat {
    flex: 1;
    background: #f7f8fb;
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    padding: 9px 11px;
  }
  .dr-stat b { display: block; font-size: 18px; font-weight: 680; line-height: 1.2; }
  .dr-stat span { font-size: 11.5px; color: var(--text-soft); }

  .dr-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .6px;
    color: var(--text-faint);
    text-transform: uppercase;
    margin: 18px 0 8px;
  }
  .dr-label:first-child { margin-top: 0; }

  .lv-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 13px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
    background: #fff;
  }
  .lv-top { display: flex; align-items: baseline; gap: 8px; }
  .lv-name { font-weight: 640; font-size: 13.5px; }
  .lv-class { font-size: 11px; color: var(--text-faint); }
  .lv-meta { font-size: 12.5px; color: #374151; margin-top: 6px; }
  .lv-reason {
    font-size: 12.5px;
    color: var(--text-soft);
    margin-top: 5px;
    line-height: 1.65;
    background: #f8f9fc;
    border-radius: 7px;
    padding: 6px 9px;
  }
  .lv-time { font-size: 11px; color: var(--text-faint); margin-top: 6px; }
  .lv-comment {
    width: 100%;
    margin-top: 9px;
    height: 30px;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 0 9px;
    font-size: 12px;
    font-family: inherit;
    color: var(--text);
    outline: none;
  }
  .lv-comment:focus { border-color: var(--accent); }
  .lv-actions { display: flex; gap: 8px; margin-top: 9px; }
  .lv-actions button {
    flex: 1;
    height: 30px;
    border-radius: 7px;
    font-size: 12.5px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: #fff;
    color: #374151;
    transition: all .13s;
  }
  .lv-actions .ok { background: #16a34a; border-color: #16a34a; color: #fff; font-weight: 550; }
  .lv-actions .ok:hover { filter: brightness(1.06); }
  .lv-actions .no { color: #b91c1c; border-color: #f0c9c9; }
  .lv-actions .no:hover { background: #fff6f6; }
  .lv-actions button:disabled { opacity: .6; cursor: not-allowed; }

  .lv-done {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 2px;
    border-bottom: 1px dashed var(--line-soft);
    font-size: 12.5px;
  }
  .lv-done:last-child { border-bottom: none; }
  .lv-done .who2 { color: #374151; font-weight: 550; }
  .lv-done .what { color: var(--text-soft); margin-top: 2px; font-size: 11.5px; line-height: 1.6; }
  .pill {
    flex: 0 0 auto;
    font-size: 11px;
    border-radius: 999px;
    padding: 2px 8px;
    margin-top: 1px;
  }
  .pill.ok { background: #e9f8ef; color: #15803d; }
  .pill.no { background: #fdeceb; color: #b91c1c; }
  .pill.wait { background: #fff6e5; color: #b45309; }

  .dr-empty {
    text-align: center;
    color: var(--text-faint);
    font-size: 12.5px;
    padding: 26px 10px;
    line-height: 1.8;
  }
  .dr-hint {
    font-size: 12px;
    color: #6b5b3e;
    background: #fff9ec;
    border: 1px solid #f5e3bd;
    border-radius: 10px;
    padding: 10px 12px;
    line-height: 1.75;
  }
  .teach-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .teach-chip {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    color: #374151;
    cursor: pointer;
  }
  .teach-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-weak); }
  .teach-chip b { color: #dc2626; font-weight: 600; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translate(-50%, 12px);
    background: #1f2937;
    color: #fff;
    font-size: 12.5px;
    padding: 9px 16px;
    border-radius: 9px;
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    max-width: 80vw;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: #b42318; }

  @media (max-width: 900px) {
    .app { padding: 10px; gap: 10px; }
    .side { display: none; }
    .bubble-wrap { max-width: 88%; }
  }

  /* ===================================================================
     墨绿主题覆盖层（2026-11-19）
     只覆盖颜色 / 圆角 / 阴影，不动任何结构；想回到蓝色，删掉这一整块即可。
     =================================================================== */
  :root {
    --bg: #f1f5f4;
    --line: #dde7e4;
    --line-soft: #ecf2f0;
    --text: #10221f;
    --text-soft: #5c706b;
    --text-faint: #8a9a96;
    --accent: #0f766e;
    --accent-weak: #e4f3ef;
    --radius: 10px;
    --shadow-sm: 0 1px 2px rgba(16, 34, 31, .05);
    --shadow-md: 0 10px 28px rgba(16, 34, 31, .09);
  }
  body { background: var(--bg); }

  .brand-logo { background: linear-gradient(135deg, #0f766e, #0d9488); border-radius: 9px; }
  .brand-title { color: var(--text); }

  .agent { border-radius: 10px; }
  .agent:hover { border-color: #c3d8d3; }
  .agent.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }

  .quick { color: #34453f; border-radius: 7px; }
  .quick:hover { background: #eef5f3; color: var(--accent); }

  .chip:hover { background: var(--accent-weak); border-color: var(--accent); }

  .head-emoji { border-radius: 9px; }
  .ghost-btn, select { border-radius: 7px; }
  .ghost-btn:hover, select:hover { background: #f7fbfa; border-color: #c6d8d3; }

  .me-avatar { background: linear-gradient(135deg, #0f766e, #059669); }
  .me { border-radius: 999px; }

  .bubble { border-radius: 10px; border-color: var(--line-soft); }
  .msg.user .bubble { background: var(--accent); }
  .msg.bot .bubble { border-bottom-left-radius: 3px; }
  .msg.user .bubble { border-bottom-right-radius: 3px; }

  .chat::-webkit-scrollbar-thumb { background: #d7e3df; }

  .input-shell { border-radius: 10px; }
  .send { background: linear-gradient(135deg, #0f766e, #0f9a74); border-radius: 8px; }
  .send:hover { filter: brightness(1.06); }
  .send:disabled { background: #cfdad7; }
  .send.stop { background: #33413d; }

  .tool, .meta, .dr-stat, .lv-card { border-radius: 9px; }
  .drawer { border-radius: 14px 0 0 14px; }

  .toast { background: #10221f; border-radius: 8px; }

  /* ================= 我的工作台（按身份取数） ================= */
  .ws-btn { position: relative; display: inline-flex; align-items: center; gap: 6px; }
  .ws-btn[hidden] { display: none; }
  .ws-drawer { width: min(560px, 100vw); }
  .ws-kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 18px; }
  .ws-kpi {
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 13px; box-shadow: var(--shadow-sm);
  }
  .ws-kpi .k { font-size: 11px; color: var(--text-soft); letter-spacing: .2px; }
  .ws-kpi .v { font-size: 22px; font-weight: 650; margin-top: 5px; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
  .ws-kpi .h { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
  .ws-kpi { grid-column: span 2; }
  .ws-kpi.hero {
    grid-column: span 6;
    background: linear-gradient(135deg, #0f766e 0%, #059669 100%);
    border-color: transparent; color: #fff;
  }
  .ws-kpi.hero .k { color: rgba(255,255,255,.78); }
  .ws-kpi.hero .v { font-size: 30px; }
  .ws-kpi.hero .h { color: rgba(255,255,255,.7); }

  .ws-sec { margin-bottom: 20px; }
  .ws-sec-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .ws-sec-h b { font-size: 13px; font-weight: 650; }
  .ws-sec-h span { font-size: 11px; color: var(--text-faint); }
  .ws-list { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .ws-item { padding: 11px 13px; border-bottom: 1px solid var(--line-soft); }
  .ws-item:last-child { border-bottom: 0; }
  .ws-item-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ws-item-h b { font-size: 13px; font-weight: 600; }
  .ws-meta { font-size: 11px; color: var(--text-faint); }
  .ws-phone { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11.5px; color: var(--text-soft); }
  .ws-brief { margin-top: 6px; font-size: 12px; line-height: 1.7; color: #3f5a55; }
  .ws-logdet { margin-top: 4px; line-height: 1.6; white-space: pre-wrap; }
  .ws-tag {
    font-size: 10px; padding: 2px 6px; border-radius: 99px;
    background: var(--accent-weak); color: var(--accent); border: 1px solid transparent;
  }
  .ws-tag.src { background: #fff3e4; color: #b45309; }
  .ws-follow { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .ws-follow select, .ws-follow input, .ws-follow button {
    font: inherit; font-size: 12px; height: 30px; border-radius: 7px;
    border: 1px solid var(--line); background: #fff; color: var(--text); padding: 0 8px;
  }
  .ws-follow input { flex: 1 1 180px; min-width: 0; }
  .ws-follow input:focus, .ws-follow select:focus { outline: none; border-color: var(--accent); }
  .ws-follow button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; padding: 0 12px; }
  .ws-follow button:disabled { opacity: .55; cursor: default; }
  .ws-acts { display: flex; gap: 6px; margin-top: 8px; }
  .ws-acts button {
    font: inherit; font-size: 12px; height: 30px; padding: 0 12px; border-radius: 7px;
    border: 1px solid var(--line); background: #fff; cursor: pointer;
  }
  .ws-acts button.ok { border-color: #b7e4cb; background: #f2fbf5; color: #15803d; }
  .ws-acts button.no { border-color: #f3c6c6; background: #fff7f7; color: #b91c1c; }
  .ws-acts button:disabled { opacity: .5; cursor: default; }
  .ws-details { margin-top: 6px; font-size: 11.5px; color: var(--text-faint); }
  .ws-details summary { cursor: pointer; }
  .ws-details pre {
    margin: 6px 0 0; padding: 8px 10px; background: #f5f8f7; border-radius: 7px;
    font-family: inherit; font-size: 11.5px; line-height: 1.7; white-space: pre-wrap; color: #3f5a55;
  }
  /* 心理预警：高危整条左侧标红，学生原话单独一块，处理记录跟在下面 */
  .al-card.high { background: #fffafa; box-shadow: inset 3px 0 0 #dc2626; }
  .al-quote {
    margin-top: 7px; padding: 8px 10px; border-radius: 8px; background: #fff5f5;
    font-size: 12.5px; line-height: 1.75; color: #7f1d1d;
  }
  .al-form { margin-top: 8px; }
  .al-form textarea {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 12px; line-height: 1.7;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--text); resize: vertical;
  }
  .al-form textarea:focus { outline: none; border-color: var(--accent); }
  .al-hist { margin-top: 10px; }
  .al-hist summary { cursor: pointer; font-size: 12px; color: var(--text-faint); padding: 8px 2px; }
  .al-done { padding: 10px 12px; border-top: 1px dashed var(--line-soft); }
  .al-note { margin-top: 5px; font-size: 12px; line-height: 1.7; color: #3f5a55; }
  /* 学生反馈：学生端表单在上、记录在下；老师端一条一个回复框 */
  .fb-form {
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 13px; margin-bottom: 16px;
  }
  .fb-cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 9px; }
  .fb-cat {
    font: inherit; font-size: 11.5px; height: 26px; padding: 0 10px; border-radius: 99px;
    border: 1px solid var(--line); background: #fff; color: var(--text-soft); cursor: pointer;
  }
  .fb-cat.on { border-color: var(--accent); background: var(--accent-weak); color: var(--accent); font-weight: 600; }
  .fb-form textarea {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 12.5px; line-height: 1.75;
    padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfd;
    color: var(--text); resize: vertical;
  }
  .fb-form textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
  .fb-foot { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .fb-foot .ws-meta { flex: 1; }
  .fb-foot button {
    font: inherit; font-size: 12px; height: 30px; padding: 0 14px; border-radius: 7px;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer;
  }
  .fb-foot button:disabled { opacity: .55; cursor: default; }
  .fb-card.new { box-shadow: inset 3px 0 0 #d97706; }
  .fb-text { margin-top: 7px; font-size: 12.5px; line-height: 1.75; color: var(--text); }
  .fb-detail { margin-top: 4px; line-height: 1.7; }
  .fb-reply {
    margin-top: 8px; padding: 9px 11px; border-radius: 8px; background: #f2fbf5;
    border-left: 2px solid #86d3a8; font-size: 12px; line-height: 1.75; color: #14532d;
  }
  .fb-reply b { font-size: 11.5px; margin-right: 6px; }
  .fb-wait { margin-top: 8px; }
  /* 心理周记：学生填详细状态，老师按同一张卡回复 */
  .jr-form {
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 13px; margin-bottom: 16px;
  }
  .jr-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
  .jr-line > b { font-size: 11.5px; color: var(--text-soft); min-width: 62px; font-weight: 600; }
  .jr-cats { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
  .jr-chip {
    font: inherit; font-size: 11.5px; height: 26px; padding: 0 9px; border-radius: 99px;
    border: 1px solid var(--line); background: #fff; color: var(--text-soft); cursor: pointer;
  }
  .jr-chip.on { border-color: #a855f7; background: #f3e8ff; color: #7e22ce; font-weight: 600; }
  .jr-range { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .jr-range input[type="range"] { flex: 1; min-width: 100px; accent-color: #7e22ce; }
  .jr-range output {
    min-width: 26px; text-align: right; font-size: 12px; font-weight: 650;
    font-variant-numeric: tabular-nums; color: #7e22ce;
  }
  .jr-form textarea {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 12.5px; line-height: 1.75;
    padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfd;
    color: var(--text); resize: vertical;
  }
  .jr-form textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
  .jr-profile { margin-bottom: 14px; background: #fcfbff; }
  .jr-hist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .jr-hit {
    font-size: 11px; padding: 3px 8px; border-radius: 99px;
    background: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff;
  }
  .ws-score { display: flex; align-items: baseline; gap: 8px; }
  .ws-score .num { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .ws-score .num.warn { color: #b45309; }
  .ws-split { display: flex; align-items: center; gap: 8px; }
  .ws-split .grow { flex: 1; min-width: 0; }
  .ws-empty { padding: 18px; text-align: center; color: var(--text-faint); font-size: 12px; }

  /* ---- 成绩录入 ---- */
  .g-rows { margin-top: 8px; border-top: 1px dashed var(--line-soft); }
  .g-row {
    display: grid; grid-template-columns: minmax(0, 1fr) 104px 52px 26px 22px;
    gap: 8px; align-items: center; padding: 6px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  .g-row:last-child { border-bottom: 0; }
  .g-course { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-sem { font-size: 10.5px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-score { font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; color: var(--text); }
  .g-score.warn { color: #b45309; }
  .g-del {
    width: 20px; height: 20px; padding: 0; line-height: 1;
    border: 1px solid var(--line); background: #fff; border-radius: 5px;
    color: var(--text-faint); font-size: 10px; cursor: pointer;
  }
  .g-del:hover { border-color: var(--danger); color: var(--danger); }
  .g-edit {
    width: 24px; height: 20px; padding: 0; line-height: 1;
    border: 1px solid var(--line); background: #fff; border-radius: 5px;
    color: var(--text-soft); font-size: 10px; cursor: pointer;
  }
  .g-edit:hover { border-color: var(--accent); color: var(--accent); }
  .g-row.editing { display: flex; gap: 6px; }
  .g-row.editing .g-course { flex: 1; min-width: 0; }
  .g-input {
    width: 64px; height: 26px; padding: 0 7px; font: inherit; font-size: 12px;
    border: 1px solid var(--accent); border-radius: 6px; background: #fff;
  }
  .g-input:focus { outline: none; }
  .g-save, .g-cancel {
    height: 26px; padding: 0 9px; border-radius: 6px; font: inherit; font-size: 11px; cursor: pointer;
  }
  .g-save { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .g-cancel { border: 1px solid var(--line); background: #fff; color: var(--text-soft); }
  .g-save:disabled { opacity: .55; cursor: default; }
  .g-form {
    display: grid; grid-template-columns: minmax(0, 1.4fr) 74px minmax(0, 1fr) 56px;
    gap: 6px; margin-top: 9px;
  }
  .g-form input {
    min-width: 0; height: 30px; padding: 0 8px;
    font: inherit; font-size: 11.5px; color: var(--text);
    border: 1px solid var(--line); border-radius: 7px; background: #fbfcfd;
  }
  .g-form input:focus { outline: none; border-color: var(--accent); background: #fff; }
  .g-form button {
    height: 30px; border: 1px solid var(--accent); border-radius: 7px;
    background: var(--accent); color: #fff; font: inherit; font-size: 11.5px; cursor: pointer;
  }
  .g-form button:disabled { opacity: .55; cursor: default; }
  /* ---- 账户管理 ---- */
  .acct-form {
    display: grid;
    grid-template-columns: minmax(0, .9fr) minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1.05fr) minmax(0, 1fr) 78px;
    gap: 6px; margin-bottom: 4px;
  }
  .acct-form input, .acct-form select {
    min-width: 0; height: 32px; padding: 0 8px;
    font: inherit; font-size: 11.5px; color: var(--text);
    border: 1px solid var(--line); border-radius: 7px; background: #fbfcfd;
  }
  .acct-form input:focus, .acct-form select:focus { outline: none; border-color: var(--accent); background: #fff; }
  .acct-form button {
    height: 32px; border: 1px solid var(--accent); border-radius: 7px;
    background: var(--accent); color: #fff; font: inherit; font-size: 11.5px; cursor: pointer;
  }
  .acct-form button:disabled { opacity: .55; cursor: default; }
  .acct-hint { margin: 6px 0 12px; font-size: 11px; line-height: 1.6; color: var(--text-faint); }
  /* ---- 班级与班主任 ---- */
  .acct-form .f-class { grid-column: span 2; }
  .cls-box {
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin: 2px 0 12px; background: #fbfcfd;
  }
  .cls-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .cls-head b { font-size: 12px; }
  .cls-head span { font-size: 11px; color: var(--text-faint); line-height: 1.5; }
  .cls-row {
    display: grid; grid-template-columns: 74px minmax(0, 1fr) minmax(0, 1.15fr) 52px;
    gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line-soft);
  }
  .cls-name { font-size: 12px; font-weight: 600; }
  .cls-meta { font-size: 11px; color: var(--text-faint); }
  .cls-row select, .cls-new select, .cls-new input {
    min-width: 0; height: 28px; padding: 0 6px; font: inherit; font-size: 11px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text);
  }
  .cls-row select:focus, .cls-new select:focus, .cls-new input:focus {
    outline: none; border-color: var(--accent);
  }
  .cls-row button, .cls-new button {
    height: 28px; border: 1px solid var(--accent); border-radius: 6px; background: #fff;
    color: var(--accent); font: inherit; font-size: 11px; cursor: pointer;
  }
  .cls-row button:disabled, .cls-new button:disabled { opacity: .5; cursor: default; }
  .cls-new {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 52px;

  /* ---- 活动安排 ---- */
  .act-form { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); }
  .act-form .f-title { grid-column: span 2; }

  .act-cap { position: relative; min-width: 0; }

  .act-bar { height: 6px; margin: 9px 0 6px; border-radius: 99px; background: var(--line-soft); overflow: hidden; }
  .act-bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .act-bar i.full { background: #b45309; }
  .act-line {
    display: flex; align-items: center; justify-content: space-between;

  .act-line b { font-variant-numeric: tabular-nums; color: var(--text); }
  .act-toggle {
    font: inherit; font-size: 11px; height: 26px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 6px;

  .act-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .act-people { margin-top: 8px; border-top: 1px dashed var(--line-soft); }
  .act-person {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    padding: 7px 0; border-bottom: 1px solid var(--line-soft); font-size: 11.5px;

  .act-person:last-child { border-bottom: 0; }
  .act-person b { font-weight: 600; color: var(--text); }
  .act-phone { font-family: var(--mono); color: var(--text-soft); letter-spacing: .02em; }
  .act-note { flex: 1 1 100%; color: var(--text-faint); line-height: 1.55; }
  .act-time { margin-left: auto; font-size: 10.5px; color: var(--text-faint); }
  .act-empty { padding: 12px 0 4px; text-align: center; font-size: 11.5px; color: var(--text-faint); }
  @media (max-width: 760px) {
    .act-form { grid-template-columns: 1fr 1fr; }
    .act-form .f-title { grid-column: span 2; }
    .act-form button { grid-column: span 2; }
  }
  @media (max-width: 760px) {
    .acct-form { grid-template-columns: 1fr 1fr; }
    .acct-form button { grid-column: span 2; }
    .acct-form .f-class { grid-column: span 2; }
    .cls-row { grid-template-columns: minmax(0, 1fr) auto; }
    .cls-row select { grid-column: 1 / -1; }

  @media (max-width: 640px) {
    .g-form { grid-template-columns: minmax(0, 1fr) 66px; }
    .g-form input[name="semester"] { grid-column: 1 / -1; }
    .g-row { grid-template-columns: minmax(0, 1fr) 46px 26px 22px; }
    .g-sem { display: none; }
  }
  .ws-foot {
    margin-top: 4px; padding: 13px 14px; border-radius: 10px;
    background: #f5f8f7; border: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .ws-foot p { margin: 0; font-size: 11.5px; color: var(--text-soft); flex: 1 1 160px; }
  .ws-foot a {

<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-logo">粤教</div>
      <div>
        <div class="brand-title">智能体中台</div>
        <div class="brand-sub">Dify × FastAPI · 演示控制台</div>
      </div>
    </div>

    <div class="agents" id="agents"></div>

    <div class="side-block nav-block" id="nav-block" hidden>
      <p class="side-label">我的事项</p>

    </div>

    <div class="side-block">
      <p class="side-label">快捷提问</p>

  <main class="main">

      <div class="head-right">

        <a class="ghost-btn" id="admin-link" href="/admin" hidden style="text-decoration:none;line-height:1.6">数据后台</a>
        <select id="user-select" title="模拟任意身份（仅管理员）" hidden></select>
        <div class="me" id="me-chip" title="">
          <span class="me-avatar" id="me-avatar">·</span>
          <span class="me-info"><b id="me-name">未登录</b><i id="me-role">—</i></span>
        </div>
        <button class="ghost-btn" id="logout-btn" title="退出登录，换一个角色">退出</button>

    <section class="panel" id="panel" hidden>
      <div class="panel-head">

    <div class="chat" id="chat"></div>

    <div class="composer">

        <button class="send" id="send">发送</button>

  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div class="toast" id="toast"></div>



<script>
(function () {
  "use strict";

  var TOKEN_KEY = "yj_token";

  var state = {
    agents: [],
    agent: null,
    userId: null,
    user: null,      // 登录用户（角色决定可见 Agent / 数据范围 / 功能入口）
    perms: {},
    conversationId: "",
    streaming: false,
    controller: null,
    ws: null,        // 我的工作台缓存（按角色）
    panelKey: null,  // 当前打开的事项面板（leaves / leads / logs）
  };

  function token() {
    return localStorage.getItem(TOKEN_KEY) || "";
  }

  var el = {
    agents: document.getElementById("agents"),
    quicks: document.getElementById("quicks"),
    headEmoji: document.getElementById("head-emoji"),
    headName: document.getElementById("head-name"),
    headTag: document.getElementById("head-tag"),
    userSelect: document.getElementById("user-select"),
    clearBtn: document.getElementById("clear-btn"),
    logoutBtn: document.getElementById("logout-btn"),
    meChip: document.getElementById("me-chip"),
    meAvatar: document.getElementById("me-avatar"),
    meName: document.getElementById("me-name"),
    meRole: document.getElementById("me-role"),
    chat: document.getElementById("chat"),
    input: document.getElementById("input"),
    send: document.getElementById("send"),
    footUser: document.getElementById("foot-user"),
    hintConv: document.getElementById("hint-conv"),
    wsBtn: document.getElementById("ws-btn"),
    wsLabel: document.getElementById("ws-label"),
    wsBadge: document.getElementById("ws-badge"),
    navBlock: document.getElementById("nav-block"),
    navs: document.getElementById("navs"),
    panel: document.getElementById("panel"),
    panelBack: document.getElementById("panel-back"),
    panelTitle: document.getElementById("panel-title"),
    panelSub: document.getElementById("panel-sub"),
    panelBody: document.getElementById("panel-body"),
    composer: document.querySelector(".composer"),
    approveBtn: document.getElementById("approve-btn"),
    approveBadge: document.getElementById("approve-badge"),
    drawer: document.getElementById("drawer"),
    drawerMask: document.getElementById("drawer-mask"),
    drawerSub: document.getElementById("drawer-sub"),
    drawerBody: document.getElementById("drawer-body"),
    drawerClose: document.getElementById("drawer-close"),
    toast: document.getElementById("toast"),
  };

  /* ---------------- 轻量 Markdown ---------------- */
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inline(s) {
    s = s.replace(/`([^`]+)`/g, function (_, c) { return "<code>" + c + "</code>"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }

  function renderMarkdown(src) {
    var lines = escapeHtml(src).split("\n");
    var out = [];
    var list = null; // "ul" | "ol"
    var inCode = false;
    var buf = [];

    function closeList() {
      if (list) { out.push("</" + list + ">"); list = null; }
    }
    function flushPara() {
      if (buf.length) { out.push("<p>" + inline(buf.join(" ")) + "</p>"); buf = []; }
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];

      if (/^```/.test(line.trim())) {
        flushPara(); closeList();
        if (inCode) { out.push("</code></pre>"); inCode = false; }
        else { out.push("<pre><code>"); inCode = true; }
        continue;
      }
      if (inCode) { out.push(line + "\n"); continue; }

      if (!line.trim()) { flushPara(); closeList(); continue; }

      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { flushPara(); closeList(); out.push("<h4>" + inline(h[2]) + "</h4>"); continue; }

      if (/^\s*(?:[-*·•])\s+/.test(line)) {
        flushPara();
        if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
        out.push("<li>" + inline(line.replace(/^\s*(?:[-*·•])\s+/, "")) + "</li>");
        continue;
      }
      if (/^\s*\d+[.)]\s+/.test(line)) {
        flushPara();
        if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
        out.push("<li>" + inline(line.replace(/^\s*\d+[.)]\s+/, "")) + "</li>");
        continue;
      }
      if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { flushPara(); closeList(); out.push("<hr>"); continue; }

      if (list) { closeList(); }
      buf.push(line.trim());
    }

    flushPara(); closeList();
    if (inCode) out.push("</code></pre>");
    return out.join("");
  }

  /* ---------------- 渲染骨架 ---------------- */
  function renderAgents() {
    el.agents.innerHTML = "";
    state.agents.forEach(function (a) {
      var b = document.createElement("button");
      b.className = "agent" + (state.agent && state.agent.key === a.key ? " on" : "");
      b.innerHTML =
        '<span class="agent-emoji">' + a.icon + "</span>" +
        '<span class="agent-body"><span class="agent-name">' + a.name + "</span>" +
        '<span class="agent-tag">' + a.tagline + "</span></span>";
      b.addEventListener("click", function () { switchAgent(a.key); });
      el.agents.appendChild(b);
    });
  }

  function renderQuicks() {
    el.quicks.innerHTML = "";
    (state.agent.prompts || []).forEach(function (p) {
      var b = document.createElement("button");
      b.className = "quick";
      b.textContent = p;
      b.addEventListener("click", function () {
        el.input.value = p;
        autoGrow();
        el.input.focus();
      });
      el.quicks.appendChild(b);
    });
  }

  function renderUsers() {
    var canSwitch = !!(state.perms && state.perms.switch_identity);
    el.userSelect.hidden = !canSwitch;
    el.userSelect.innerHTML = "";
    state.agent.users.forEach(function (u) {
      var o = document.createElement("option");
      o.value = u.id;
      o.textContent = u.label;
      el.userSelect.appendChild(o);
    });
    el.userSelect.value = state.userId;
    var u = currentUser();
    el.footUser.innerHTML =
      "当前身份：" + escapeHtml(u.label) +
      "<br>角色：" + escapeHtml(state.user ? state.user.role_label : "—") +
      (canSwitch ? "（可模拟）" : "");
  }

  function renderMe() {
    var u = state.user;
    if (!u) return;
    el.meAvatar.textContent = u.initial || (u.real_name || "?").slice(0, 1);
    el.meName.textContent = u.real_name;
    el.meRole.textContent = u.role_label;
    el.meChip.title = u.role_desc +
      (u.students ? "（名下 " + u.students + " 名学生）" : "");
  }

  function currentUser() {
    var id = Number(state.userId);
    return state.agent.users.filter(function (u) { return u.id === id; })[0] || state.agent.users[0];
  }

  // 审批人：管理员走全校视图（用自己 id），其他人就是当前身份
  function approverId() {
    return state.perms.approve === "all" && state.user ? state.user.id : Number(state.userId);
  }

  var WS_HINT = {
    staff: "左侧「待跟进线索」能看到分给你的客户，点一条就能写跟进、改状态。",
    teacher: "左侧「待处理请假」可直接通过 / 驳回，处理完会记进你的日志。",
    student: "左侧「请假记录」能看到批没批；也可以直接问我“我的请假请完了吗”。",
    admin: "左侧可看全校待批请假，数据后台有图表、全部数据表和操作日志。",
  };

  function emptyState() {
    var a = state.agent;
    el.chat.innerHTML = "";
    var wrap = document.createElement("div");
    wrap.className = "empty";
    wrap.innerHTML =
      '<div class="empty-emoji">' + a.icon + "</div>" +
      '<div class="empty-title">' + a.name + "</div>" +
      '<div class="empty-text">' + a.welcome + "</div>" +
      (state.user && WS_HINT[state.user.role]
        ? '<div class="empty-text" style="font-size:12px;color:var(--text-faint);margin-top:8px">' +
          WS_HINT[state.user.role] + "</div>"
        : "");
    var chips = document.createElement("div");
    chips.className = "empty-chips";
    a.prompts.slice(0, 4).forEach(function (p) {
      var c = document.createElement("button");
      c.className = "chip";
      c.textContent = p;
      c.addEventListener("click", function () { send(p); });
      chips.appendChild(c);
    });
    wrap.appendChild(chips);
    el.chat.appendChild(wrap);
  }

  /* ---------------- 消息节点 ---------------- */
  function scrollBottom(force) {
    var near = el.chat.scrollHeight - el.chat.scrollTop - el.chat.clientHeight < 160;
    if (force || near) el.chat.scrollTop = el.chat.scrollHeight;
  }

  function addUserMsg(text) {
    var d = document.createElement("div");
    d.className = "msg user";
    d.innerHTML =
      '<div class="avatar">🙋</div>' +
      '<div class="bubble-wrap"><div class="bubble">' + escapeHtml(text).replace(/\n/g, "<br>") + "</div></div>";
    el.chat.appendChild(d);
    scrollBottom(true);
  }

  function addBotMsg() {
    var d = document.createElement("div");
    d.className = "msg bot";
    d.innerHTML =
      '<div class="avatar">' + state.agent.icon + "</div>" +
      '<div class="bubble-wrap">' +
        '<div class="who">' + state.agent.name + "</div>" +
        '<div class="tools" hidden></div>' +
        '<div class="bubble"><span class="body"></span><span class="cursor"></span></div>' +
        '<div class="meta" hidden></div>' +
      "</div>";
    el.chat.appendChild(d);
    scrollBottom(true);
    return {
      node: d,
      tools: d.querySelector(".tools"),
      body: d.querySelector(".body"),
      cursor: d.querySelector(".cursor"),
      meta: d.querySelector(".meta"),
      text: "",
      toolSet: {},
      startedAt: performance.now(),
    };
  }

  function pushTool(ref, title) {
    if (ref.toolSet[title]) return;
    ref.toolSet[title] = true;
    ref.tools.hidden = false;
    var s = document.createElement("span");
    s.className = "tool active";
    s.innerHTML = '<span class="mini-dot"></span>' + escapeHtml(title);
    ref.tools.appendChild(s);
  }

  /* 模型偶尔会自己补一行空的「查询语句：」，展示层兜底裁掉 */
  function tidyAnswer(t) {
    if (!t) return t;
    var prev = null;
    while (prev !== t) {
      prev = t;
      t = t.replace(/\n*[`*_\s]*查询语句\s*[：:]?[`*_\s]*$/, "");
      t = t.replace(/\n*[`*_\s]*(SQL|查询 SQL)\s*[：:]?[`*_\s]*$/, "");
    }
    return t;
  }

  function finishBotMsg(ref, usage, errMsg) {
    var clean = tidyAnswer(ref.text);
    if (clean !== ref.text) {
      ref.text = clean;
      ref.body.innerHTML = renderMarkdown(ref.text);
    }
    ref.cursor.remove();
    if (errMsg) {
      var e = document.createElement("div");
      e.className = "err";
      e.textContent = errMsg;
      ref.body.parentElement.appendChild(e);
      if (!ref.text) ref.body.parentElement.style.display = "none";
      return;
    }
    var secs = ((performance.now() - ref.startedAt) / 1000).toFixed(1);
    var parts = ["耗时 " + secs + "s"];
    if (usage && usage.total_tokens) parts.push("tokens " + usage.total_tokens);
    var price = usage ? parseFloat(usage.total_price) : 0;
    if (price > 0) parts.push("¥" + price.toFixed(4));
    ref.meta.hidden = false;
    ref.meta.textContent = parts.join(" · ");
    Array.prototype.forEach.call(ref.tools.children, function (t) { t.classList.remove("active"); });
  }

  /* ---------------- 请假审批抽屉 ---------------- */
  var toastTimer = null;

  function toast(msg, isErr) {
    el.toast.textContent = msg;
    el.toast.classList.toggle("err", !!isErr);
    el.toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove("on"); }, 3600);
  }

  function apiGet(url) {
    return fetch(url).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) throw new Error((d && (d.detail || d.msg)) || ("HTTP " + r.status));
        return d.data;
      });
    });
  }

  // 头像栏按钮：员工助手 + 有审批权限的角色才出现；管理员看全校待办
  function updateApproveEntry() {
    if (!el.approveBtn) return;
    var perm = state.perms && state.perms.approve;
    var onEmployee = state.agent && state.agent.key === "employee";
    el.approveBtn.hidden = !(perm && (onEmployee || perm === "all"));
    if (el.approveBtn.hidden) return;
    var scope = perm === "all" ? "&scope=all" : "";
    apiGet("/api/leave/summary?approver_id=" + approverId() + scope)
      .then(function (d) {
        if (d.pending > 0) {
          el.approveBadge.hidden = false;
          el.approveBadge.textContent = d.pending;
          el.approveBtn.title = (perm === "all" ? "全校还有 " : "还有 ") + d.pending + " 条请假待处理";
        } else {
          el.approveBadge.hidden = true;
          el.approveBtn.title = "暂无待审批的请假";
        }
      })
      .catch(function () { el.approveBadge.hidden = true; });
  }

  function openDrawer() {
    el.drawerMask.hidden = false;
    el.drawer.classList.add("on");
    loadApprovals();
  }

  function closeDrawer() {
    el.drawer.classList.remove("on");
    el.drawerMask.hidden = true;
  }

  function loadApprovals() {
    var uid = approverId();
    var scope = state.perms.approve === "all" ? "&scope=all" : "";
    el.drawerBody.innerHTML = '<div class="dr-empty">正在读取…</div>';
    Promise.all([
      apiGet("/api/leave/summary?approver_id=" + uid + scope),
      apiGet("/api/leave/pending?approver_id=" + uid + scope),
      apiGet("/api/leave/handled?approver_id=" + uid + "&limit=6" + scope),
      apiGet("/api/leave/teachers"),
    ])
      .then(function (res) { renderApprovals(res[0], res[1], res[2], res[3]); })
      .catch(function (e) {
        el.drawerSub.textContent = "读取失败";
        el.drawerBody.innerHTML = '<div class="dr-empty">' + escapeHtml(e.message || String(e)) + "</div>";
      });
  }

  function renderApprovals(sum, pending, handled, teachers) {
    if (sum.is_admin_view) {
      el.drawerSub.textContent = sum.approver_name + " · " + (sum.department || "") +
        " · 全校 " + sum.students.length + " 名学生（可代任何班主任审批）";
    } else if (sum.is_homeroom) {
      el.drawerSub.textContent = sum.approver_name + " · " + (sum.department || "") +
        " · 名下 " + sum.students.length + " 名学生";
    } else {
      el.drawerSub.textContent = sum.approver_name + " · 当前身份不是班主任";
    }

    var html = "";

    if (!sum.is_homeroom) {
      html += '<div class="dr-hint">这个身份名下没有学生，无法审批。切换成下面任意一位班主任再试：</div>';
      html += '<div class="teach-chips">';
      teachers.forEach(function (t) {
        html += '<button class="teach-chip" data-switch="' + t.id + '">' + escapeHtml(t.name) +
          (t.pending ? " · 待办 <b>" + t.pending + "</b>" : " · 无待办") + "</button>";
      });
      html += "</div>";
      el.drawerBody.innerHTML = html;
      return;
    }

    html += '<div class="dr-stats">' +
      '<div class="dr-stat"><b>' + sum.pending + '</b><span>待审批</span></div>' +
      '<div class="dr-stat"><b>' + sum.handled + '</b><span>已处理</span></div>' +
      '<div class="dr-stat"><b>' + sum.students.length + '</b><span>' +
        (sum.is_admin_view ? "全校学生" : "名下学生") + '</span></div>' +
      "</div>";

    html += '<p class="dr-label">待审批</p>';
    if (!pending.length) {
      html += '<div class="dr-empty">没有待审批的请假，<br>学生提交后会自动出现在这里。</div>';
    } else {
      pending.forEach(function (r) {
        html += '<div class="lv-card">' +
          '<div class="lv-top"><span class="lv-name">' + escapeHtml(r.student_name) + "</span>" +
            '<span class="lv-class">' + escapeHtml(r.student_class || "") + "</span></div>" +
          '<div class="lv-meta">' + escapeHtml(r.period_text || "") + "</div>" +
          '<div class="lv-reason">' + escapeHtml(r.reason || "（未填写事由）") + "</div>" +
          '<div class="lv-time">' +
            (sum.is_admin_view ? "班主任 " + escapeHtml(r.approver_name || "—") + " · " : "") +
            "提交于 " + escapeHtml(r.create_time_short || "—") + "</div>" +
          '<input class="lv-comment" data-comment="' + r.id + '" placeholder="审批意见（可选，学生查询时能看到）">' +
          '<div class="lv-actions">' +
            '<button class="ok" data-act="ok" data-id="' + r.id + '">通过</button>' +
            '<button class="no" data-act="no" data-id="' + r.id + '">驳回</button>' +
          "</div></div>";
      });
    }

    html += '<p class="dr-label">最近处理</p>';
    if (!handled.length) {
      html += '<div class="dr-empty">还没有处理记录。</div>';
    } else {
      handled.forEach(function (r) {
        var ok = r.status === "已通过";
        html += '<div class="lv-done">' +
          '<span class="pill ' + (ok ? "ok" : "no") + '">' + escapeHtml(r.status) + "</span>" +
          "<div><div class=\"who2\">" + escapeHtml(r.student_name) + " · " + escapeHtml(r.period_text || "") + "</div>" +
          '<div class="what">' + (r.approve_time_short ? escapeHtml(r.approve_time_short) + " 处理" : "") +
            (r.approve_comment ? " · " + escapeHtml(r.approve_comment) : "") + "</div></div></div>";
      });
    }

    el.drawerBody.innerHTML = html;
  }

  function decide(recordId, approved, comment) {
    Array.prototype.forEach.call(
      el.drawerBody.querySelectorAll("button[data-act]"),
      function (b) { b.disabled = true; }
    );
    fetch("/api/leave/approve", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token() },
      body: JSON.stringify({
        record_id: recordId,
        approver_id: state.user ? state.user.id : Number(state.userId),
        approved: approved,
        comment: comment || "",
      }),
    })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          return d;
        });
      })
      .then(function (d) {
        toast(d.msg + "，学生再查请假就能看到你和审批意见");
        loadApprovals();
        updateApproveEntry();
      })
      .catch(function (e) {
        toast("审批失败：" + (e.message || e), true);
        loadApprovals();
      });
  }

  if (el.approveBtn) el.approveBtn.addEventListener("click", openDrawer);
  el.drawerClose.addEventListener("click", closeDrawer);
  el.drawerMask.addEventListener("click", closeDrawer);

  el.drawerBody.addEventListener("click", function (ev) {
    var sw = ev.target.closest("[data-switch]");
    if (sw) {
      closeDrawer();
      el.userSelect.value = sw.getAttribute("data-switch");
      el.userSelect.dispatchEvent(new Event("change"));
      setTimeout(openDrawer, 260);
      return;
    }
    var btn = ev.target.closest("button[data-act]");
    if (!btn) return;
    var card = btn.closest(".lv-card");
    var input = card ? card.querySelector(".lv-comment") : null;
    decide(Number(btn.getAttribute("data-id")), btn.getAttribute("data-act") === "ok", input ? input.value.trim() : "");
  });

  /* ---------------- 我的工作台：按身份只取自己权限内的数据 ---------------- */
  var WS_LABEL = { admin: "数据总览", teacher: "我的班级", staff: "客户线索", student: "我的学业" };

  function wsHeaders() {
    var h = { "Content-Type": "application/json" };
    var t = token();
    if (t) h.Authorization = "Bearer " + t;
    return h;
  }

  function wsGet(url) {
    return fetch(url, { headers: wsHeaders() }).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) throw new Error((d && (d.detail || d.msg)) || ("HTTP " + r.status));
        return d.data;
      });
    });
  }

  function pillClass(st) {
    if (/已签约|已通过|已解决|优秀/.test(st)) return "ok";
    if (/流失|驳回/.test(st)) return "no";
    return "wait";
  }

  /* 后端错误：detail 可能是字符串，也可能是 {msg, alternatives} 对象 */
  function detailText(d) {
    if (!d) return "";
    if (typeof d === "string") return d;
    if (typeof d.detail === "string") return d.detail;
    if (d.detail && d.detail.msg) return d.detail.msg;
    if (typeof d.message === "string") return d.message;
    return "";
  }

  /* ---- 各类型条目 ---- */
  function wsLeadItem(it, canFollow, statuses) {
    var h = '<div class="ws-item">' +
      '<div class="ws-item-h"><b>' + escapeHtml(it.name) + "</b>" +
      '<span class="pill ' + pillClass(it.status) + '">' + escapeHtml(it.status) + "</span>" +
      (it.source === "在线客服" ? '<span class="ws-tag src">在线客服留资</span>' : "") +
      '<span class="ws-meta">' + escapeHtml(it.owner) + " · " + escapeHtml(it.time) + "</span></div>" +
      '<div class="ws-item-h" style="margin-top:5px"><span class="ws-phone">' + escapeHtml(it.phone) + "</span>" +
      '<span class="ws-meta">' + escapeHtml(it.brief) + "</span></div>";

    if (canFollow) {
      h += '<div class="ws-follow" data-lead="' + it.id + '"><select class="st">' +
        statuses.map(function (st) {
          return '<option value="' + escapeHtml(st) + '"' + (st === it.status ? " selected" : "") + ">" + escapeHtml(st) + "</option>";
        }).join("") + "</select>" +
        '<input class="note" placeholder="写一条跟进，回车保存">' +
        '<button class="save">保存</button></div>';

    if (it.history) {
      h += '<details class="ws-details"><summary>跟进记录</summary><pre>' + escapeHtml(it.history) + "</pre></details>";
    }

  function wsLeaveItem(it, canAct) {
    var h = '<div class="ws-item"><div class="ws-item-h"><b>' + escapeHtml(it.student) + "</b>" +
      '<span class="pill ' + pillClass(it.status) + '">' + escapeHtml(it.status) + "</span>" +

      h += '<div class="ws-acts" data-leave="' + it.id + '">' +
        '<button class="ok">通过</button><button class="no">驳回</button></div>';
    }
    return h + "</div>";

  function wsStudentItem(it) {
    var warn = it.avg !== null && it.avg < 75;
    var info = [];
    if (it.username) info.push("账号 " + it.username);
    if (it.contact) info.push(it.contact);
    return '<div class="ws-item"><div class="ws-item-h"><b>' + escapeHtml(it.name) + "</b>" +
      (it.class_name ? '<span class="ws-tag">' + escapeHtml(it.class_name) + "</span>" : "") +
      '<span class="ws-meta">' + escapeHtml(it.dept) + "</span></div>" +
      (info.length ? '<div class="ws-item-h" style="margin-top:4px"><span class="ws-meta">' +
        escapeHtml(info.join(" · ")) + "</span></div>" : "") +
      '<div class="ws-split" style="margin-top:6px"><span class="ws-score">' +
      '<span class="num' + (warn ? " warn" : "") + '">' + (it.avg === null ? "—" : it.avg) + "</span>" +
      '<span class="ws-meta">均分 · ' + escapeHtml(it.level) + "</span></span>" +
      '<span class="grow"></span>' +
      (it.alerts ? '<span class="ws-tag" style="background:#fee2e2;color:#b91c1c">心理预警 ' + it.alerts + "</span>" : "") +
      (it.journals ? '<span class="ws-tag" style="background:#f3e8ff;color:#7e22ce">心理周记 ' + it.journals + "</span>" : "") +
